<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root {
            --color-bg: #F0F7F4;
            --color-surface: #FFFFFF;
            --color-primary: #00B894;
            --color-primary-text: #FFFFFF;
            --color-secondary: #DFF5E1;
            --color-accent: #0984E3;
            --color-text: #2D3436;
            --color-text-muted: #636E72;
            --color-border: #DFE6E9;
            --color-success: #00B894;
            --color-warning: #FFA500;
            --color-error: #FF4757;
            --color-income: #00B894;
            --color-expense: #FF6B6B;
        }
        * { font-family: 'Poppins', sans-serif; }
        body { background-color: var(--color-bg); }
        .swipe-item { position: relative; overflow: hidden; }
        .swipe-item-content { display: flex; transition: transform 0.3s ease-out; touch-action: pan-y; }
        .swipe-item.swiped .swipe-item-content { transform: translateX(calc(0px - 60px)); }
        .swipe-delete { position: absolute; right: 0; top: 0; bottom: 0; width: 60px; background-color: var(--color-error); display: none; align-items: center; justify-content: center; color: white; cursor: pointer; }
        .swipe-item.swiped .swipe-delete { display: flex; }
        input, select, textarea { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
class MoneyTracker {
    constructor() {
        const data = this.loadData();
        this.accounts = data?.accounts || [];
        this.categories = data?.categories || this.defaultCategories();
        this.transactions = data?.transactions || [];
        this.budgets = data?.budgets || [];
        this.tasks = data?.tasks || [];
        this.income = data?.income || { salary: 0, otherIncomeEnabled: false, otherIncomeAmount: 0 };
        this.currentTab = 'planning';
        this.showSettings = false;
        this.settingsSection = 'accounts';
        this.addingAccount = false;
        this.editingAccount = null;
        this.addingCategory = false;
        this.editingCategory = null;
        this.addingTask = false;
        this.editingTask = null;
        this.addingTransaction = false;
        this.editingTransaction = null;
        this.txnFilterAccount = 'all';
        this.txnFilterCategory = 'all';
        this.txnFilterType = 'all';
        this.searchText = '';
        this.editingBudget = null;
        this.expandedGroups = { essential: false, saving: false, spending: false };
        this.otherIncomeUIEnabled = this.income.otherIncomeEnabled;
        this.migrateLegacyIncomeCategories();
        this.render();
    }
    // Removes old "Salary" / "Other Income" categories left over from earlier versions
    // of this app, where income lived as a category instead of a Settings > Income field.
    migrateLegacyIncomeCategories() {
        const legacyNames = ['salary', 'other income'];
        const before = this.categories.length;
        this.categories = this.categories.filter(c => !legacyNames.includes((c.name || '').trim().toLowerCase()));
        if (this.categories.length !== before) {
            const remainingIds = new Set(this.categories.map(c => c.id));
            this.budgets = this.budgets.filter(b => remainingIds.has(b.categoryId));
            this.transactions.forEach(t => { if (t.categoryId && !remainingIds.has(t.categoryId)) t.categoryId = ''; });
            this.tasks.forEach(t => { if (t.categoryId && !remainingIds.has(t.categoryId)) t.categoryId = ''; });
            this.saveData();
        }
    }
    defaultCategories() {
        return [
            { id: 'c_housing', name: 'Housing', group: 'essential' },
            { id: 'c_utilities', name: 'Utilities', group: 'essential' },
            { id: 'c_groceries', name: 'Groceries', group: 'essential' },
            { id: 'c_transport', name: 'Transport', group: 'essential' },
            { id: 'c_savings', name: 'Savings', group: 'saving' },
            { id: 'c_subscriptions', name: 'Subscriptions', group: 'spending' },
            { id: 'c_entertainment', name: 'Entertainment', group: 'spending' },
            { id: 'c_other', name: 'Other', group: 'spending' }
        ];
    }
    categoryGroup(c) { return c.group || 'spending'; }
    loadData() { try { return JSON.parse(localStorage.getItem('moneyTrackerData')); } catch(e) { return null; } }
    saveData() { try { localStorage.setItem('moneyTrackerData', JSON.stringify({accounts: this.accounts, categories: this.categories, transactions: this.transactions, budgets: this.budgets, tasks: this.tasks, income: this.income})); } catch(e) {} }
    uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
    fmt(n) { const v = isNaN(n) ? 0 : n; return '£' + v.toFixed(2); }
    monthKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
    monthLabel(key) { const [y,m] = key.split('-'); const d = new Date(parseInt(y), parseInt(m)-1, 1); return d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }); }
    initSwipeHandlers() {
        setTimeout(() => {
            document.querySelectorAll('[data-swipe-item]').forEach(el => {
                let touchStartX = 0, touchEndX = 0;
                el.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; });
                el.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    if (touchStartX - touchEndX > 50) el.classList.add('swiped');
                    else if (touchEndX - touchStartX > 50) el.classList.remove('swiped');
                });
            });
        }, 100);
    }

    // ---------- ACCOUNTS ----------
    accountBalance(accId) {
        const acc = this.accounts.find(a => a.id === accId);
        if (!acc) return 0;
        let bal = parseFloat(acc.startingBalance) || 0;
        this.transactions.filter(t => t.accountId === accId).forEach(t => {
            bal += (t.type === 'income' ? 1 : -1) * (parseFloat(t.amount) || 0);
        });
        return bal;
    }
    toggleAddAccount() { this.addingAccount = !this.addingAccount; this.editingAccount = null; this.render(); }
    toggleEditAccount(id) { this.editingAccount = this.editingAccount === id ? null : id; this.render(); }
    saveAccount(id, name, type, startingBalance) {
        if (!name) return;
        if (id) {
            const a = this.accounts.find(x => x.id === id);
            if (a) { a.name = name; a.type = type; a.startingBalance = parseFloat(startingBalance) || 0; }
            this.editingAccount = null;
        } else {
            this.accounts.push({ id: this.uid(), name, type, startingBalance: parseFloat(startingBalance) || 0 });
            this.addingAccount = false;
        }
        this.saveData(); this.render();
    }
    deleteAccount(id) {
        if (!confirm('Delete this account? Transactions linked to it will remain but show as unassigned.')) return;
        this.accounts = this.accounts.filter(a => a.id !== id);
        this.saveData(); this.render();
    }

    // ---------- CATEGORIES ----------
    toggleAddCategory() { this.addingCategory = !this.addingCategory; this.editingCategory = null; this.render(); }
    toggleEditCategory(id) { this.editingCategory = this.editingCategory === id ? null : id; this.render(); }
    saveCategory(id, name, group) {
        if (!name) return;
        if (id) {
            const c = this.categories.find(x => x.id === id);
            if (c) { c.name = name; c.group = group || 'spending'; }
            this.editingCategory = null;
        } else {
            this.categories.push({ id: this.uid(), name, group: group || 'spending' });
            this.addingCategory = false;
        }
        this.saveData(); this.render();
    }
    deleteCategory(id) {
        if (!confirm('Delete this category? Budgets for it will also be removed.')) return;
        this.categories = this.categories.filter(c => c.id !== id);
        this.budgets = this.budgets.filter(b => b.categoryId !== id);
        this.transactions.forEach(t => { if (t.categoryId === id) t.categoryId = ''; });
        this.tasks.forEach(t => { if (t.categoryId === id) t.categoryId = ''; });
        if (this.editingBudget === id) this.editingBudget = null;
        if (this.editingCategory === id) this.editingCategory = null;
        if (this.txnFilterCategory === id) this.txnFilterCategory = 'all';
        this.saveData(); this.render();
    }

    // ---------- INCOME SETTINGS ----------
    totalIncome() { return (parseFloat(this.income.salary) || 0) + (this.income.otherIncomeEnabled ? (parseFloat(this.income.otherIncomeAmount) || 0) : 0); }
    toggleOtherIncomeUI(checked) { this.otherIncomeUIEnabled = checked; this.render(); }
    saveIncomeSettings(salary, otherEnabled, otherAmount) {
        this.income.salary = parseFloat(salary) || 0;
        this.income.otherIncomeEnabled = !!otherEnabled;
        this.income.otherIncomeAmount = otherEnabled ? (parseFloat(otherAmount) || 0) : 0;
        this.otherIncomeUIEnabled = this.income.otherIncomeEnabled;
        this.saveData(); this.render();
    }

    // ---------- BUDGETS (Planning) ----------
    getBudget(categoryId) { return this.budgets.find(b => b.categoryId === categoryId); }
    toggleEditBudget(categoryId) { this.editingBudget = this.editingBudget === categoryId ? null : categoryId; this.render(); }
    setBudget(categoryId, amount) {
        const amt = parseFloat(amount) || 0;
        let b = this.getBudget(categoryId);
        this.editingBudget = null;
        if (!b) { b = { categoryId, monthlyAmount: amt }; this.budgets.push(b); }
        else { b.monthlyAmount = amt; }
        this.saveData(); this.render();
    }
    actualForCategoryThisMonth(categoryId) {
        const mk = this.monthKey();
        return this.transactions.filter(t => t.categoryId === categoryId && this.monthKey(new Date(t.date)) === mk)
            .reduce((s,t) => s + (parseFloat(t.amount) || 0), 0);
    }

    // ---------- TASKS (Monthly recurring) ----------
    toggleAddTask() { this.addingTask = !this.addingTask; this.editingTask = null; this.render(); }
    toggleEditTask(id) { this.editingTask = this.editingTask === id ? null : id; this.render(); }
    saveTask(id, text, orderPos) {
        if (!text) return;
        const pos = Math.max(1, parseInt(orderPos) || (this.tasks.length + 1));
        if (id) {
            const idx = this.tasks.findIndex(x => x.id === id);
            if (idx === -1) return;
            const t = this.tasks[idx];
            t.text = text;
            this.tasks.splice(idx, 1);
            const insertAt = Math.min(pos - 1, this.tasks.length);
            this.tasks.splice(insertAt, 0, t);
            this.editingTask = null;
        } else {
            const t = { id: this.uid(), text, paidMonths: {} };
            const insertAt = Math.min(pos - 1, this.tasks.length);
            this.tasks.splice(insertAt, 0, t);
            this.addingTask = false;
        }
        this.saveData(); this.render();
    }
    deleteTask(id) {
        if (!confirm('Delete this recurring task?')) return;
        this.tasks = this.tasks.filter(t => t.id !== id);
        this.saveData(); this.render();
    }
    toggleTaskPaid(id) {
        const t = this.tasks.find(x => x.id === id);
        if (!t) return;
        const mk = this.monthKey();
        t.paidMonths = t.paidMonths || {};
        if (t.paidMonths[mk]) delete t.paidMonths[mk];
        else t.paidMonths[mk] = true;
        this.saveData(); this.render();
    }

    // ---------- TRANSACTIONS (Tracking) ----------
    toggleAddTransaction() { this.addingTransaction = !this.addingTransaction; this.editingTransaction = null; this.render(); }
    toggleEditTransaction(id) { this.editingTransaction = this.editingTransaction === id ? null : id; this.render(); }
    saveTransaction(id, date, accountId, categoryId, type, amount, description, notes) {
        if (!date || !accountId || !amount) return;
        if (id) {
            const t = this.transactions.find(x => x.id === id);
            if (t) { t.date = date; t.accountId = accountId; t.categoryId = categoryId; t.type = type; t.amount = parseFloat(amount) || 0; t.description = description; t.notes = notes; }
            this.editingTransaction = null;
        } else {
            this.transactions.push({ id: this.uid(), date, accountId, categoryId, type, amount: parseFloat(amount) || 0, description, notes });
            this.addingTransaction = false;
        }
        this.saveData(); this.render();
    }
    deleteTransaction(id) {
        this.transactions = this.transactions.filter(t => t.id !== id);
        this.saveData(); this.render();
    }
    filteredTransactions() {
        return this.transactions.filter(t => {
            if (this.txnFilterAccount !== 'all' && t.accountId !== this.txnFilterAccount) return false;
            if (this.txnFilterCategory !== 'all' && t.categoryId !== this.txnFilterCategory) return false;
            if (this.txnFilterType !== 'all' && t.type !== this.txnFilterType) return false;
            if (this.searchText && !(t.description || '').toLowerCase().includes(this.searchText.toLowerCase())) return false;
            return true;
        }).sort((a,b) => new Date(b.date) - new Date(a.date));
    }

    // ---------- REPORTING ----------
    totalBalance() { return this.accounts.reduce((s,a) => s + this.accountBalance(a.id), 0); }
    monthTotals() {
        const mk = this.monthKey();
        const txns = this.transactions.filter(t => this.monthKey(new Date(t.date)) === mk);
        const income = txns.filter(t => t.type === 'income').reduce((s,t) => s + (parseFloat(t.amount)||0), 0);
        const expense = txns.filter(t => t.type === 'expense').reduce((s,t) => s + (parseFloat(t.amount)||0), 0);
        return { income, expense, net: income - expense };
    }
    topCategoriesThisMonth() {
        const mk = this.monthKey();
        const map = {};
        this.transactions.filter(t => t.type === 'expense' && this.monthKey(new Date(t.date)) === mk).forEach(t => {
            const cat = this.categories.find(c => c.id === t.categoryId);
            const name = cat ? cat.name : 'Uncategorised';
            map[name] = (map[name] || 0) + (parseFloat(t.amount)||0);
        });
        return Object.entries(map).map(([name,spent]) => ({name,spent})).sort((a,b) => b.spent - a.spent).slice(0,5);
    }
    exportCSV() {
        let csv = 'Date,Account,Category,Type,Amount,Description,Notes\n';
        this.transactions.forEach(t => {
            const acc = this.accounts.find(a => a.id === t.accountId);
            const cat = this.categories.find(c => c.id === t.categoryId);
            const row = [t.date, acc?acc.name:'', cat?cat.name:'', t.type, t.amount, t.description||'', t.notes||''];
            csv += row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'money-tracker-export.csv'; a.click();
        URL.revokeObjectURL(url);
    }

    // ---------- RENDER: PLANNING ----------
    renderBudgetRow(c) {
        const b = this.getBudget(c.id);
        const target = b ? b.monthlyAmount : 0;
        const isEditing = this.editingBudget === c.id || !b;
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<div class="flex items-center justify-between" style="color: var(--color-text);"><span class="font-medium">' + c.name + '</span>';
        if (isEditing) {
            html += '<div class="flex items-center gap-2"><span class="text-xs" style="color: var(--color-text-muted);">Target £</span><input id="bg_' + c.id + '" type="number" step="0.01" value="' + target + '" class="w-20 px-2 py-1 rounded border text-sm" style="border-color: var(--color-border);"><button onclick="window.app.setBudget(\'' + c.id + '\', document.getElementById(\'bg_' + c.id + '\').value)" class="text-xs px-2 py-1 rounded text-white" style="background-color: var(--color-primary);">Save</button></div></div>';
        } else {
            html += '<div class="flex items-center gap-2"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(target) + '</span><button onclick="window.app.toggleEditBudget(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Edit</button></div></div>';
        }
        html += '</div>';
        return html;
    }
    toggleGroupExpand(key) { this.expandedGroups[key] = !this.expandedGroups[key]; this.render(); }
    groupBudgetTotal(key) {
        return this.categories.filter(c => this.categoryGroup(c) === key)
            .reduce((sum, c) => { const b = this.getBudget(c.id); return sum + (b ? (parseFloat(b.monthlyAmount) || 0) : 0); }, 0);
    }
    renderPlanningTab() {
        const totalIncome = this.totalIncome();
        let html = '<p class="text-sm mb-4" style="color: var(--color-text-muted);">Set a monthly budget target for each category, then hit Save. Actuals below reflect ' + this.monthLabel(this.monthKey()) + '.</p>';
        if (totalIncome === 0) html += '<p class="text-sm mb-4 p-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Set your salary in ⚙️ Settings → Income to see each section&#8217;s share of income.</p>';

        const groups = [['essential','Essentials'],['saving','Savings'],['spending','Spending']];
        groups.forEach(([key,label]) => {
            const cats = this.categories.filter(c => this.categoryGroup(c) === key);
            if (cats.length === 0) return;
            const groupTotal = this.groupBudgetTotal(key);
            const pct = totalIncome > 0 ? ((groupTotal / totalIncome) * 100).toFixed(1) : '—';
            const expanded = !!this.expandedGroups[key];
            html += '<button onclick="window.app.toggleGroupExpand(\'' + key + '\')" class="w-full flex items-center justify-between py-3 px-1 mt-3 border-b" style="border-color: var(--color-border);">';
            html += '<span class="text-sm font-bold uppercase" style="color: var(--color-text);">' + (expanded ? '▾ ' : '▸ ') + label + '</span>';
            html += '<span class="text-sm font-bold" style="color: var(--color-expense);">' + (totalIncome > 0 ? pct + '% of income' : this.fmt(groupTotal)) + '</span></button>';
            if (expanded) {
                cats.forEach(c => { html += this.renderBudgetRow(c); });
            }
        });

        if (this.categories.length === 0) html += '<p style="color: var(--color-text-muted);">No categories yet. Add some in Settings.</p>';
        return html;
    }

    // ---------- RENDER: TASKS ----------
    renderTasksTab() {
        const mk = this.monthKey();
        let html = '<div class="flex items-center justify-between mb-4"><p class="text-sm" style="color: var(--color-text-muted);">' + this.monthLabel(mk) + '</p><button onclick="window.app.resetMonthlyTasks()" class="text-xs px-3 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">↻ Reset for new month</button></div>';

        if (this.tasks.length === 0) html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No monthly tasks yet. Add some in ⚙️ Settings → Monthly Tasks.</p>';

        this.tasks.forEach(t => {
            const paid = !!(t.paidMonths && t.paidMonths[mk]);
            html += '<label class="flex items-center gap-3 p-3 rounded-lg border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border); cursor: pointer;">';
            html += '<input type="checkbox" ' + (paid?'checked':'') + ' onchange="window.app.toggleTaskPaid(\'' + t.id + '\')" class="w-5 h-5 flex-shrink-0">';
            html += '<p class="flex-1" style="color: var(--color-text); ' + (paid?'text-decoration: line-through; opacity: 0.6;':'') + '">' + t.text + '</p>';
            html += '</label>';
        });
        return html;
    }
    resetMonthlyTasks() {
        if (this.tasks.length === 0) return;
        if (!confirm('Reset all monthly tasks for ' + this.monthLabel(this.monthKey()) + '? This will untick everything for this month.')) return;
        const mk = this.monthKey();
        this.tasks.forEach(t => { if (t.paidMonths) delete t.paidMonths[mk]; });
        this.saveData(); this.render();
    }
    renderTaskForm(t) {
        const isEdit = !!t;
        const currentIdx = isEdit ? this.tasks.findIndex(x => x.id === t.id) : -1;
        const optionCount = isEdit ? this.tasks.length : this.tasks.length + 1;
        const defaultPos = isEdit ? currentIdx + 1 : optionCount;
        let html = '<div class="p-4 rounded-lg border mb-3" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<input id="tk_text" placeholder="Task (e.g. Enter salary, Adjust monthly figures)" value="' + (t?t.text:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Order</p>';
        let opts = '';
        for (let i = 1; i <= optionCount; i++) { opts += '<option value="' + i + '"' + (i===defaultPos?' selected':'') + '>' + i + '</option>'; }
        html += '<select id="tk_order" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">' + opts + '</select>';
        html += '<div class="flex gap-2"><button onclick="window.app.saveTask(' + (isEdit?"'"+t.id+"'":'null') + ', document.getElementById(\'tk_text\').value, document.getElementById(\'tk_order\').value)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditTask(\''+t.id+'\')':'toggleAddTask()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }

    // ---------- RENDER: TRACKING ----------
    renderTrackingTab() {
        let html = '<div class="mb-3"><input type="text" placeholder="Search description..." value="' + this.searchText + '" oninput="window.app.searchText=this.value; window.app.render()" class="w-full px-3 py-2 rounded border" style="border-color: var(--color-border);"></div>';
        html += '<div class="grid grid-cols-3 gap-2 mb-4">';
        html += '<select onchange="window.app.txnFilterAccount=this.value; window.app.render()" class="px-2 py-2 rounded border text-sm" style="border-color: var(--color-border);"><option value="all">All accounts</option>' + this.accounts.map(a => '<option value="' + a.id + '"' + (this.txnFilterAccount===a.id?' selected':'') + '>' + a.name + '</option>').join('') + '</select>';
        html += '<select onchange="window.app.txnFilterCategory=this.value; window.app.render()" class="px-2 py-2 rounded border text-sm" style="border-color: var(--color-border);"><option value="all">All categories</option>' + this.categories.map(c => '<option value="' + c.id + '"' + (this.txnFilterCategory===c.id?' selected':'') + '>' + c.name + '</option>').join('') + '</select>';
        html += '<select onchange="window.app.txnFilterType=this.value; window.app.render()" class="px-2 py-2 rounded border text-sm" style="border-color: var(--color-border);"><option value="all">All types</option><option value="income"' + (this.txnFilterType==='income'?' selected':'') + '>Income</option><option value="expense"' + (this.txnFilterType==='expense'?' selected':'') + '>Expense</option></select>';
        html += '</div>';

        if (this.addingTransaction) html += this.renderTransactionForm(null);
        if (this.accounts.length === 0 && !this.addingTransaction) html += '<p class="text-center py-4 text-sm" style="color: var(--color-text-muted);">Add an account in Settings before logging transactions.</p>';

        const txns = this.filteredTransactions();
        if (txns.length === 0) html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No transactions yet.</p>';

        txns.forEach(t => {
            if (this.editingTransaction === t.id) { html += this.renderTransactionForm(t); return; }
            const acc = this.accounts.find(a => a.id === t.accountId);
            const cat = this.categories.find(c => c.id === t.categoryId);
            html += '<div class="swipe-item mb-2" data-swipe-item><div class="swipe-item-content"><div class="p-3 rounded-lg border flex-1" style="background-color: var(--color-surface); border-color: var(--color-border);">';
            html += '<div class="flex items-center justify-between"><div><p class="font-medium" style="color: var(--color-text);">' + (t.description || '(no description)') + '</p>';
            html += '<p class="text-xs" style="color: var(--color-text-muted);">' + t.date + (acc?' · ' + acc.name:'') + (cat?' · ' + cat.name:'') + '</p></div>';
            html += '<p class="font-bold" style="color: ' + (t.type === 'income' ? 'var(--color-income)' : 'var(--color-expense)') + ';">' + (t.type === 'income' ? '+' : '−') + this.fmt(t.amount) + '</p></div>';
            html += '<button onclick="window.app.toggleEditTransaction(\'' + t.id + '\')" class="text-xs px-2 py-1 rounded mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">Edit</button>';
            html += '</div></div><div class="swipe-delete" onclick="window.app.deleteTransaction(\'' + t.id + '\')">Delete</div></div>';
        });
        return html;
    }
    renderTransactionForm(t) {
        const isEdit = !!t;
        let html = '<div class="p-4 rounded-lg border mb-3" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<div class="grid grid-cols-2 gap-2 mb-2"><button onclick="this.closest(\'div.p-4\').dataset.type=\'expense\'; document.getElementById(\'tx_type_lbl\').innerText=\'Expense\'; document.getElementById(\'tx_type_expense\').style.opacity=1; document.getElementById(\'tx_type_income\').style.opacity=0.4;" id="tx_type_expense" class="py-2 rounded text-white" style="background-color: var(--color-expense);">Expense</button>';
        html += '<button onclick="this.closest(\'div.p-4\').dataset.type=\'income\'; document.getElementById(\'tx_type_lbl\').innerText=\'Income\'; document.getElementById(\'tx_type_income\').style.opacity=1; document.getElementById(\'tx_type_expense\').style.opacity=0.4;" id="tx_type_income" class="py-2 rounded text-white" style="background-color: var(--color-income); opacity: 0.4;">Income</button></div>';
        html += '<input type="hidden" id="tx_type_hidden" value="' + (t?t.type:'expense') + '">';
        html += '<span id="tx_type_lbl" style="display:none;">' + (t && t.type==='income'?'Income':'Expense') + '</span>';
        html += '<input id="tx_date" type="date" value="' + (t?t.date:new Date().toISOString().slice(0,10)) + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<input id="tx_amount" type="number" step="0.01" placeholder="Amount £" value="' + (t?t.amount:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<input id="tx_desc" placeholder="Description" value="' + (t?t.description||'':'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<select id="tx_account" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">' + this.accounts.map(a => '<option value="' + a.id + '"' + (t && t.accountId===a.id?' selected':'') + '>' + a.name + '</option>').join('') + '</select>';
        html += '<select id="tx_category" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);"><option value="">No category</option>' + this.categories.map(c => '<option value="' + c.id + '"' + (t && t.categoryId===c.id?' selected':'') + '>' + c.name + ' (' + this.categoryGroup(c) + ')</option>').join('') + '</select>';
        html += '<textarea id="tx_notes" placeholder="Notes (optional)" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">' + (t?t.notes||'':'') + '</textarea>';
        const saveTypeExpr = "(document.getElementById('tx_type_income').style.opacity=='1' ? 'income' : 'expense')";
        html += '<div class="flex gap-2"><button onclick="window.app.saveTransaction(' + (isEdit?"'"+t.id+"'":'null') + ', document.getElementById(\'tx_date\').value, document.getElementById(\'tx_account\').value, document.getElementById(\'tx_category\').value, ' + saveTypeExpr + ', document.getElementById(\'tx_amount\').value, document.getElementById(\'tx_desc\').value, document.getElementById(\'tx_notes\').value)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditTransaction(\''+t.id+'\')':'toggleAddTransaction()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';
        html += '<script>(function(){var exp=document.getElementById("tx_type_expense"),inc=document.getElementById("tx_type_income");if("' + (t?t.type:'expense') + '"==="income"){exp.style.opacity=0.4;inc.style.opacity=1;}else{exp.style.opacity=1;inc.style.opacity=0.4;}})();<' + '/script>';
        html += '</div>';
        return html;
    }

    // ---------- RENDER: REPORTING ----------
    renderReportingTab() {
        const mt = this.monthTotals();
        let html = '<p class="text-sm mb-3" style="color: var(--color-text-muted);">' + this.monthLabel(this.monthKey()) + '</p>';
        html += '<div class="grid grid-cols-2 gap-3 mb-4">';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-accent); text-transform: uppercase;">Total Balance</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + this.fmt(this.totalBalance()) + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: ' + (mt.net>=0?'var(--color-success)':'var(--color-error)') + '; text-transform: uppercase;">This Month Net</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + this.fmt(mt.net) + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-income); text-transform: uppercase;">Income</p><p class="text-xl font-bold" style="color: var(--color-text);">' + this.fmt(mt.income) + '</p></div>';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-expense); text-transform: uppercase;">Expenses</p><p class="text-xl font-bold" style="color: var(--color-text);">' + this.fmt(mt.expense) + '</p></div>';
        html += '</div>';

        html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Accounts</p>';
        if (this.accounts.length === 0) html += '<p style="color: var(--color-text-muted); font-size: 14px;">No accounts yet.</p>';
        this.accounts.forEach((a,idx) => {
            html += '<div class="flex items-center justify-between pb-2' + (idx < this.accounts.length-1?' border-b':'') + ' mb-2" style="' + (idx < this.accounts.length-1?'border-color: var(--color-border);':'') + '"><span style="color: var(--color-text);">' + a.name + ' <span class="text-xs" style="color: var(--color-text-muted);">(' + a.type + ')</span></span><span class="font-bold" style="color: var(--color-text);">' + this.fmt(this.accountBalance(a.id)) + '</span></div>';
        });
        html += '</div>';

        const top = this.topCategoriesThisMonth();
        if (top.length > 0) {
            html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Top Spending Categories</p>';
            top.forEach((c,idx) => {
                html += '<div class="flex items-center justify-between pb-2' + (idx < top.length-1?' border-b':'') + '" style="' + (idx < top.length-1?'border-color: var(--color-border);':'') + '"><span style="color: var(--color-text);">' + (idx+1) + '. ' + c.name + '</span><span class="font-bold" style="color: var(--color-expense);">' + this.fmt(c.spent) + '</span></div>';
            });
            html += '</div>';
        }
        return html;
    }

    // ---------- RENDER: SETTINGS ----------
    renderSettings() {
        let html = '<div class="max-w-4xl mx-auto px-4 py-4 border-t" style="border-color: var(--color-border); background-color: var(--color-surface);"><h3 class="font-semibold mb-3" style="color: var(--color-text);">Settings</h3>';
        html += '<div class="flex gap-2 mb-4 flex-wrap"><button onclick="window.app.settingsSection=\'accounts\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='accounts'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='accounts'?'var(--color-primary-text)':'var(--color-text)') + ';">Accounts</button>';
        html += '<button onclick="window.app.settingsSection=\'categories\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='categories'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='categories'?'var(--color-primary-text)':'var(--color-text)') + ';">Categories</button>';
        html += '<button onclick="window.app.settingsSection=\'income\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='income'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='income'?'var(--color-primary-text)':'var(--color-text)') + ';">Income</button>';
        html += '<button onclick="window.app.settingsSection=\'tasks\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='tasks'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='tasks'?'var(--color-primary-text)':'var(--color-text)') + ';">Monthly Tasks</button>';
        html += '<button onclick="window.app.exportCSV()" class="px-3 py-1 rounded-full text-sm" style="background-color: var(--color-bg); color: var(--color-text);">📥 Export CSV</button></div>';

        if (this.settingsSection === 'accounts') {
            if (this.addingAccount) html += this.renderAccountForm(null);
            this.accounts.forEach(a => {
                if (this.editingAccount === a.id) { html += this.renderAccountForm(a); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span style="color: var(--color-text);">' + a.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(' + a.type + ', starts ' + this.fmt(a.startingBalance) + ')</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditAccount(\'' + a.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteAccount(\'' + a.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingAccount) html += '<button onclick="window.app.toggleAddAccount()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Account</button>';
        } else if (this.settingsSection === 'categories') {
            if (this.addingCategory) html += this.renderCategoryForm(null);
            this.categories.forEach(c => {
                if (this.editingCategory === c.id) { html += this.renderCategoryForm(c); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span style="color: var(--color-text);">' + c.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(' + this.categoryGroup(c) + ')</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditCategory(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteCategory(\'' + c.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingCategory) html += '<button onclick="window.app.toggleAddCategory()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Category</button>';
        } else if (this.settingsSection === 'income') {
            html += this.renderIncomeSettings();
        } else if (this.settingsSection === 'tasks') {
            if (this.addingTask) html += this.renderTaskForm(null);
            this.tasks.forEach((t, idx) => {
                if (this.editingTask === t.id) { html += this.renderTaskForm(t); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span class="text-xs" style="color: var(--color-text-muted);">' + (idx+1) + '.</span> <span style="color: var(--color-text);">' + t.text + '</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditTask(\'' + t.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteTask(\'' + t.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingTask) html += '<button onclick="window.app.toggleAddTask()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Monthly Task</button>';
        }
        html += '<button onclick="window.app.toggleSettings()" class="w-full mt-4 py-2 rounded-lg" style="background-color: var(--color-secondary); color: var(--color-text);">Close Settings</button></div>';
        return html;
    }
    renderAccountForm(a) {
        const isEdit = !!a;
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<input id="ac_name" placeholder="Account name" value="' + (a?a.name:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<select id="ac_type" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">' + ['Checking','Savings','Credit Card','Cash','Other'].map(ty => '<option' + (a && a.type===ty?' selected':'') + '>' + ty + '</option>').join('') + '</select>';
        html += '<input id="ac_start" type="number" step="0.01" placeholder="Starting balance £" value="' + (a?a.startingBalance:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<div class="flex gap-2"><button onclick="window.app.saveAccount(' + (isEdit?"'"+a.id+"'":'null') + ', document.getElementById(\'ac_name\').value, document.getElementById(\'ac_type\').value, document.getElementById(\'ac_start\').value)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditAccount(\''+a.id+'\')':'toggleAddAccount()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }
    renderIncomeSettings() {
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Salary (monthly, £)</p>';
        html += '<input id="inc_salary" type="number" step="0.01" placeholder="e.g. 2500" value="' + (this.income.salary || '') + '" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">';
        html += '<label class="flex items-center gap-2 mb-3" style="color: var(--color-text);"><input id="inc_other_toggle" type="checkbox" ' + (this.otherIncomeUIEnabled ? 'checked' : '') + ' onchange="window.app.toggleOtherIncomeUI(this.checked)"> Other income?</label>';
        if (this.otherIncomeUIEnabled) {
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Other income (monthly, £)</p>';
            html += '<input id="inc_other_amount" type="number" step="0.01" placeholder="e.g. 200" value="' + (this.income.otherIncomeAmount || '') + '" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">';
        }
        html += '<button onclick="window.app.saveIncomeSettings(document.getElementById(\'inc_salary\').value, document.getElementById(\'inc_other_toggle\').checked, ' + (this.otherIncomeUIEnabled ? "document.getElementById('inc_other_amount').value" : '0') + ')" class="w-full py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '</div>';
        return html;
    }
    renderCategoryForm(c) {
        const isEdit = !!c;
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<input id="ca_name" placeholder="Category name" value="' + (c?c.name:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Group</p>';
        html += '<select id="ca_group" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);"><option value="essential"' + (c && this.categoryGroup(c)==='essential'?' selected':'') + '>Essential</option><option value="saving"' + (c && this.categoryGroup(c)==='saving'?' selected':'') + '>Saving</option><option value="spending"' + (!c || this.categoryGroup(c)==='spending'?' selected':'') + '>Spending</option></select>';
        html += '<div class="flex gap-2"><button onclick="window.app.saveCategory(' + (isEdit?"'"+c.id+"'":'null') + ', document.getElementById(\'ca_name\').value, document.getElementById(\'ca_group\').value)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditCategory(\''+c.id+'\')':'toggleAddCategory()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }

    toggleSettings() { this.showSettings = !this.showSettings; this.render(); }

    render() {
        let content = '';
        if (this.currentTab === 'planning') content = this.renderPlanningTab();
        else if (this.currentTab === 'tasks') content = this.renderTasksTab();
        else if (this.currentTab === 'tracking') content = this.renderTrackingTab();
        else if (this.currentTab === 'reporting') content = this.renderReportingTab();

        const addAction = this.currentTab === 'tracking' ? 'window.app.toggleAddTransaction()' : 'null';
        const showAddBtn = this.currentTab === 'tracking';

        const tabs = [['planning','Planning'],['tasks','Monthly Tasks'],['tracking','Tracking'],['reporting','Reporting']];
        let tabsHtml = tabs.map(([key,label]) => '<button onclick="window.app.currentTab = \'' + key + '\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab===key?'var(--color-primary)':'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab===key?'var(--color-primary)':'transparent') + ';">' + label + '</button>').join('');

        const html = '<div style="background-color: var(--color-bg); min-height: 100vh;"><div class="sticky top-0 z-50" style="background-color: var(--color-surface); border-bottom: 1px solid var(--color-border);"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between"><h1 class="text-2xl font-bold" style="color: var(--color-text);">💷 Money Tracker</h1><div class="flex gap-2"><button onclick="window.app.toggleSettings()" class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">⚙️</button>' + (showAddBtn ? '<button onclick="' + addAction + '" class="w-10 h-10 rounded-full flex items-center justify-center text-white" style="background-color: var(--color-primary); color: var(--color-primary-text);">+</button>' : '') + '</div></div>' + (this.showSettings ? this.renderSettings() : '') + '<div class="max-w-4xl mx-auto px-4 flex gap-2 border-t overflow-x-auto" style="border-color: var(--color-border);">' + tabsHtml + '</div></div><div class="max-w-4xl mx-auto px-4 py-6 pb-20">' + content + '</div></div>';

        document.getElementById('app').innerHTML = html;
        this.initSwipeHandlers();
    }
}

window.app = new MoneyTracker();
    </script>
</body>
</html>
