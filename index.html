        this.currentTab = tab;
        this.sidebarOpen = false;
        if (tab === 'tips' && !this.hasViewedTips) { this.hasViewedTips = true; this.saveData(); }
        this.render();
    }
    navigateToSettings(groupKey, sectionKey) {
        if (this.currentTab !== 'settings') this.navHistory.push(this.currentTab);

        this.settingsSection = sectionKey;
        this.render();
    }

        html += '<div class="flex items-center gap-2 mb-2 px-1"><span class="flex items-center justify-center rounded-full flex-shrink-0" style="width: 28px; height: 28px; background-color: var(--color-bg); overflow: hidden;">' + (this.user && this.user.photoURL ? '<img src="' + this.user.photoURL + '" style="width:100%; height:100%; object-fit: cover;">' : '👤') + '</span><span class="text-xs truncate" style="color: var(--color-text-muted);">' + (this.user ? (this.user.email || 'Signed in') : '') + '</span></div>';
        html += '<button onclick="window.app.signOutUser()" class="w-full flex items-center gap-3 p-3 rounded-xl text-left"><span class="flex items-center justify-center rounded-full" style="width: 34px; height: 34px; font-size: 17px; background-color: var(--color-bg);">🚪</span><span class="font-semibold" style="color: var(--color-text);">Sign Out</span></button>';
        html += '</div>';
        html += '</div>';
        return html;
    }
    signOutUser() { auth.signOut(); }
    render() {
        let content = '';
        if (this.currentTab === 'starthere') content = this.renderStartHereTab();
        else if (this.currentTab === 'home') content = this.renderHomeTab();
        else if (this.currentTab === 'tips') content = this.renderTipsTab();
        else if (this.currentTab === 'planning') content = this.renderPlanningTab();
        else if (this.currentTab === 'tracking') content = this.renderTrackingTab();
        else if (this.currentTab === 'reporting') content = this.renderReportingTab();
        else if (this.currentTab === 'settings') content = this.renderSettings();

        const tabLabels = { starthere: 'Start Here', home: 'Home', tips: 'Tips', planning: 'Planning', tracking: 'Tracking', reporting: 'Reporting', settings: 'Settings' };

        let html = '<div style="background-color: var(--color-bg); min-height: 100vh;">';
        html += '<div class="sticky top-0 z-30" style="background-color: var(--color-surface); border-bottom: 1px solid var(--color-border);"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">';
        html += '<div class="flex items-center gap-3"><button onclick="window.app.toggleSidebar()" class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">☰</button><h1 class="text-lg font-bold" style="color: var(--color-text);">' + tabLabels[this.currentTab] + '</h1></div>';
        html += '<span class="text-xl">💷</span>';
        html += '</div></div>';
        html += '<div class="max-w-4xl mx-auto px-4 py-6 pb-20">' + content + '</div>';
        html += this.renderSidebar();
        if (this.toast) {
            html += '<div class="toast fixed z-50" style="bottom: 90px; left: 50%; transform: translateX(-50%); background-color: var(--color-text); color: white; padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.25); white-space: nowrap;">✓ ' + this.toast + '</div>';
        }
        html += '</div>';

        document.getElementById('app').innerHTML = html;
    }
}

function renderLoadingScreen() {
    document.getElementById('app').innerHTML =
        '<div class="flex items-center justify-center" style="min-height: 100vh; background-color: var(--color-bg);"><p class="text-sm" style="color: var(--color-text-muted);">Loading your data…</p></div>';
}
function signInWithGoogle() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => {
        const el = document.getElementById('login-error');
        if (el) el.textContent = 'Sign-in failed: ' + err.message;
    });
}

function renderLoadErrorScreen(message) {
    document.getElementById('app').innerHTML =
        '<div class="flex flex-col items-center justify-center" style="min-height: 100vh; background-color: var(--color-bg); padding: 24px; text-align: center;">' +
        '<p style="color: var(--color-error); margin-bottom: 12px;">Could not load your data.<br><span style="font-size: 12px; color: var(--color-text-muted);">' + message + '</span></p>' +
        '<button onclick="window.location.reload()" class="text-sm font-semibold px-4 py-2 rounded-lg text-white" style="background-color: var(--color-primary);">Retry</button>' +
        '<button onclick="auth.signOut()" class="text-sm font-semibold underline mt-3" style="color: var(--color-accent);">Sign out</button>' +
        '</div>';
}
auth.getRedirectResult().catch(err => {
    console.error('Redirect sign-in error:', err);
    renderLoginScreen();
    const el = document.getElementById('login-error');
    if (el) el.textContent = 'Sign-in failed: ' + err.message;
});
auth.onAuthStateChanged(async (user) => {
    if (!user) {
        window.app = null;
        renderLoginScreen();
        return;
    }
    renderLoadingScreen();
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('Timed out after 10s — this usually means Firestore is not set up yet, or the security rules are blocking the read.')), 10000));
    try {
        const doc = await Promise.race([db.collection('users').doc(user.uid).get(), timeout]);
        const data = doc.exists ? doc.data() : null;
        window.app = new MoneyTracker(data, user);
    } catch (err) {
        console.error('Load failed:', err);
        renderLoadErrorScreen(err.message);
    }
});

// Swipe right anywhere on screen to go back to the previous page.
(function() {
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;
        if (deltaX > 80 && Math.abs(deltaY) < 60 && window.app) {
            window.app.goBack();
        }
    }, { passive: true });
})();
