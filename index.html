<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        :root {
            --color-bg: #F0F7F4;
            --color-surface: #FFFFFF;
            --color-primary: #00B894;
            --color-primary-text: #FFFFFF;
            --color-secondary: #DFF5E1;
            --color-accent: #0984E3;
            --color-text: #2D3436;
            --color-text-muted: #636E72;
            --color-border: #DFE6E9;
            --color-success: #00B894;
            --color-warning: #FFA500;
            --color-error: #FF4757;
            --color-income: #00B894;
            --color-expense: #FF6B6B;
        }
        * { font-family: 'Poppins', sans-serif; }
        body { background-color: var(--color-bg); }
        input, select, textarea { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    <script>
class MoneyTracker {
    constructor() {
        const data = this.loadData();
        this.accounts = data?.accounts || [];
        this.accountCategories = data?.accountCategories || this.defaultAccountCategories();
        this.categories = data?.categories || this.defaultCategories();
        this.monthlyBalances = data?.monthlyBalances || [];
        this.budgets = data?.budgets || [];
        this.tasks = data?.tasks || [];
        this.income = data?.income || { salary: 0, otherIncomeEnabled: false, otherIncomeAmount: 0 };
        this.groupTargets = data?.groupTargets || { essential: 50, saving: 30, spending: 20 };
        this.currentTab = 'planning';
        this.showSettings = false;
        this.settingsSection = 'accounts';
        this.addingAccount = false;
        this.editingAccount = null;
        this.accountFormCategoryUI = '';
        this.accountFormLISAUI = false;
        this.addingAccountCategory = false;
        this.editingAccountCategory = null;
        this.addingCategory = false;
        this.editingCategory = null;
        this.categoryFormGroupUI = 'spending';
        this.addingTask = false;
        this.editingTask = null;
        this.editingBudget = null;
        this.expandedGroups = { essential: false, saving: false, spending: false, tasks: false };
        this.expandedReportCategories = {};
        this.expandedTrackingCategories = {};
        this.editingTrackingBalance = null;
        this.otherIncomeUIEnabled = this.income.otherIncomeEnabled;
        this.trackingMonth = this.monthKey();
        this.reportingTaxYear = this.taxYearStartForMonthKey(this.monthKey());
        this.reviewMonth = this.monthKey();
        this.monthlyComments = data?.monthlyComments || {};
        this.migrateLegacyIncomeCategories();
        this.migrateDefaultGroupTargets(data);
        this.render();
    }
    // If the user never customised their Planning Targets (still on the old
    // 50/20/30 default), move them onto the new 50/30/20 default.
    migrateDefaultGroupTargets(data) {
        if (!data || !data.groupTargets) return;
        const gt = data.groupTargets;
        if (gt.essential === 50 && gt.saving === 20 && gt.spending === 30) {
            this.groupTargets = { essential: 50, saving: 30, spending: 20 };
            this.saveData();
        }
    }
    // Removes old "Salary" / "Other Income" categories left over from earlier versions
    // of this app, where income lived as a category instead of a Settings > Income field.
    migrateLegacyIncomeCategories() {
        const legacyNames = ['salary', 'other income'];
        const before = this.categories.length;
        this.categories = this.categories.filter(c => !legacyNames.includes((c.name || '').trim().toLowerCase()));
        if (this.categories.length !== before) {
            const remainingIds = new Set(this.categories.map(c => c.id));
            this.budgets = this.budgets.filter(b => remainingIds.has(b.categoryId));
            this.saveData();
        }
    }
    defaultCategories() {
        return [
            { id: 'c_housing', name: 'Housing', group: 'essential' },
            { id: 'c_utilities', name: 'Utilities', group: 'essential' },
            { id: 'c_groceries', name: 'Groceries', group: 'essential' },
            { id: 'c_transport', name: 'Transport', group: 'essential' },
            { id: 'c_savings', name: 'Savings', group: 'saving' },
            { id: 'c_subscriptions', name: 'Subscriptions', group: 'spending' },
            { id: 'c_entertainment', name: 'Entertainment', group: 'spending' },
            { id: 'c_other', name: 'Other', group: 'spending' }
        ];
    }
    defaultAccountCategories() {
        return [
            { id: 'ac_bank', name: 'Bank' },
            { id: 'ac_savings', name: 'Savings' },
            { id: 'ac_investment', name: 'Investment' },
            { id: 'ac_pension', name: 'Pension' },
            { id: 'ac_property', name: 'Property' },
            { id: 'ac_other', name: 'Other' }
        ];
    }
    categoryGroup(c) { return c.group || 'spending'; }
    loadData() { try { return JSON.parse(localStorage.getItem('moneyTrackerData')); } catch(e) { return null; } }
    saveData() { try { localStorage.setItem('moneyTrackerData', JSON.stringify({accounts: this.accounts, accountCategories: this.accountCategories, categories: this.categories, monthlyBalances: this.monthlyBalances, budgets: this.budgets, tasks: this.tasks, income: this.income, groupTargets: this.groupTargets, monthlyComments: this.monthlyComments})); } catch(e) {} }
    uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
    fmt(n) { const v = isNaN(n) ? 0 : n; return '£' + v.toFixed(2); }
    fmtSigned(n) { const v = isNaN(n) ? 0 : n; return (v >= 0 ? '+' : '−') + '£' + Math.abs(v).toFixed(2); }
    monthKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
    monthLabel(key) { const [y,m] = key.split('-'); const d = new Date(parseInt(y), parseInt(m)-1, 1); return d.toLocaleString('en-GB', { month: 'long', year: 'numeric' }); }
    shiftMonthKey(mk, delta) { const [y,m] = mk.split('-').map(Number); const d = new Date(y, (m-1)+delta, 1); return this.monthKey(d); }
    taxYearStartForMonthKey(mk) { const [y,m] = mk.split('-').map(Number); return m >= 4 ? y : y - 1; }
    taxYearMonths(startYear) {
        const months = [];
        let mk = startYear + '-04';
        for (let i = 0; i < 12; i++) { months.push(mk); mk = this.shiftMonthKey(mk, 1); }
        return months;
    }
    taxYearLabel(startYear) { return startYear + '/' + String(startYear + 1).slice(-2); }
    shiftReportingTaxYear(delta) { this.reportingTaxYear += delta; this.render(); }

    // ---------- ACCOUNTS ----------
    entryAt(accountId, mk) { return this.monthlyBalances.find(e => e.accountId === accountId && e.monthKey === mk) || null; }
    latestEntryBefore(accountId, mk) {
        const entries = this.monthlyBalances.filter(e => e.accountId === accountId && e.monthKey < mk).sort((a,b) => a.monthKey.localeCompare(b.monthKey));
        return entries.length ? entries[entries.length-1] : null;
    }
    latestEntry(accountId) {
        const entries = this.monthlyBalances.filter(e => e.accountId === accountId).sort((a,b) => a.monthKey.localeCompare(b.monthKey));
        return entries.length ? entries[entries.length-1] : null;
    }
    accountBalance(accId) {
        const acc = this.accounts.find(a => a.id === accId);
        if (!acc) return 0;
        const latest = this.latestEntry(accId);
        return latest ? latest.balance : (parseFloat(acc.startingBalance) || 0);
    }
    accountCategoryName(catId) { const c = this.accountCategories.find(x => x.id === catId); return c ? c.name : 'Uncategorised'; }
    isISACategoryId(catId) { const c = this.accountCategories.find(x => x.id === catId); return !!(c && /isa/i.test(c.name.trim())); }
    isPensionCategoryId(catId) { const c = this.accountCategories.find(x => x.id === catId); return !!(c && /pension/i.test(c.name.trim())); }
    isaTypeLabel(isaType) { return isaType === 'stocks_and_shares' ? 'Stocks and Shares' : 'Cash'; }
    toggleAddAccount() { this.addingAccount = !this.addingAccount; this.editingAccount = null; this.accountFormCategoryUI = ''; this.accountFormLISAUI = false; this.render(); }
    toggleEditAccount(id) {
        this.editingAccount = this.editingAccount === id ? null : id;
        if (this.editingAccount) { const a = this.accounts.find(x => x.id === id); this.accountFormCategoryUI = a ? a.categoryId : ''; this.accountFormLISAUI = a ? !!a.isLISA : false; }
        this.render();
    }
    setAccountFormCategory(categoryId) { this.accountFormCategoryUI = categoryId; this.render(); }
    setAccountFormLISA(checked) { this.accountFormLISAUI = checked; this.render(); }
    accountWillTrackInput(categoryId, lisaChecked) {
        const cat = this.accountCategories.find(c => c.id === categoryId);
        if (cat && cat.trackInput) return true;
        return this.isPensionCategoryId(categoryId) && !!lisaChecked;
    }
    saveAccount(id, name, categoryId, startingBalance, isaType, openingMonth, isLISA, manualGrowth) {
        if (!name) return;
        const isISA = this.isISACategoryId(categoryId);
        const isPension = this.isPensionCategoryId(categoryId);
        const validMonth = /^\d{4}-\d{2}$/.test(openingMonth || '') ? openingMonth : this.monthKey();
        const willTrackInput = this.accountWillTrackInput(categoryId, isLISA);
        if (id) {
            const a = this.accounts.find(x => x.id === id);
            if (a) { a.name = name; a.categoryId = categoryId; a.startingBalance = parseFloat(startingBalance) || 0; a.isaType = isISA ? (isaType || 'cash') : undefined; a.openingMonth = validMonth; a.isLISA = isPension ? !!isLISA : undefined; a.manualGrowth = willTrackInput ? !!manualGrowth : undefined; }
            this.editingAccount = null;
        } else {
            this.accounts.push({ id: this.uid(), name, categoryId, startingBalance: parseFloat(startingBalance) || 0, isaType: isISA ? (isaType || 'cash') : undefined, openingMonth: validMonth, isLISA: isPension ? !!isLISA : undefined, manualGrowth: willTrackInput ? !!manualGrowth : undefined });
            this.addingAccount = false;
        }
        this.saveData(); this.render();
    }
    deleteAccount(id) {
        if (!confirm('Delete this account? Its monthly balance history will also be removed.')) return;
        this.accounts = this.accounts.filter(a => a.id !== id);
        this.monthlyBalances = this.monthlyBalances.filter(e => e.accountId !== id);
        this.saveData(); this.render();
    }

    // ---------- ACCOUNT CATEGORIES ----------
    toggleAddAccountCategory() { this.addingAccountCategory = !this.addingAccountCategory; this.editingAccountCategory = null; this.render(); }
    toggleEditAccountCategory(id) { this.editingAccountCategory = this.editingAccountCategory === id ? null : id; this.render(); }
    saveAccountCategory(id, name, trackInput) {
        if (!name) return;
        if (id) {
            const c = this.accountCategories.find(x => x.id === id);
            if (c) { c.name = name; c.trackInput = !!trackInput; }
            this.editingAccountCategory = null;
        } else {
            this.accountCategories.push({ id: this.uid(), name, trackInput: !!trackInput });
            this.addingAccountCategory = false;
        }
        this.saveData(); this.render();
    }
    deleteAccountCategory(id) {
        if (!confirm('Delete this account category? Accounts using it will become uncategorised.')) return;
        this.accountCategories = this.accountCategories.filter(c => c.id !== id);
        this.accounts.forEach(a => { if (a.categoryId === id) a.categoryId = ''; });
        if (this.editingAccountCategory === id) this.editingAccountCategory = null;
        this.saveData(); this.render();
    }

    // ---------- SPENDING CATEGORIES ----------
    toggleAddCategory() { this.addingCategory = !this.addingCategory; this.editingCategory = null; this.categoryFormGroupUI = 'spending'; this.render(); }
    toggleEditCategory(id) {
        this.editingCategory = this.editingCategory === id ? null : id;
        if (this.editingCategory) { const c = this.categories.find(x => x.id === id); this.categoryFormGroupUI = c ? this.categoryGroup(c) : 'spending'; }
        this.render();
    }
    setCategoryFormGroup(group) { this.categoryFormGroupUI = group; this.render(); }
    saveCategory(id, name, group, percentageBased) {
        if (!name) return;
        const pctBased = (group === 'saving') && !!percentageBased;
        if (id) {
            const c = this.categories.find(x => x.id === id);
            if (c) { c.name = name; c.group = group || 'spending'; c.percentageBased = pctBased; }
            this.editingCategory = null;
        } else {
            this.categories.push({ id: this.uid(), name, group: group || 'spending', percentageBased: pctBased });
            this.addingCategory = false;
            this.expandedGroups[group || 'spending'] = true;
        }
        this.saveData(); this.render();
    }
    deleteCategory(id) {
        if (!confirm('Delete this planning category? Budgets for it will also be removed.')) return;
        this.categories = this.categories.filter(c => c.id !== id);
        this.budgets = this.budgets.filter(b => b.categoryId !== id);
        if (this.editingBudget === id) this.editingBudget = null;
        if (this.editingCategory === id) this.editingCategory = null;
        this.saveData(); this.render();
    }

    // ---------- INCOME SETTINGS ----------
    totalIncome() { return (parseFloat(this.income.salary) || 0) + (this.income.otherIncomeEnabled ? (parseFloat(this.income.otherIncomeAmount) || 0) : 0); }
    toggleOtherIncomeUI(checked) { this.otherIncomeUIEnabled = checked; this.render(); }
    saveIncomeSettings(salary, otherEnabled, otherAmount) {
        this.income.salary = parseFloat(salary) || 0;
        this.income.otherIncomeEnabled = !!otherEnabled;
        this.income.otherIncomeAmount = otherEnabled ? (parseFloat(otherAmount) || 0) : 0;
        this.otherIncomeUIEnabled = this.income.otherIncomeEnabled;
        this.saveData(); this.render();
    }
    saveGroupTargets(essential, saving, spending) {
        this.groupTargets.essential = parseFloat(essential) || 0;
        this.groupTargets.saving = parseFloat(saving) || 0;
        this.groupTargets.spending = parseFloat(spending) || 0;
        this.saveData(); this.render();
    }

    // ---------- BUDGETS (Planning) ----------
    getBudget(categoryId) { return this.budgets.find(b => b.categoryId === categoryId); }
    toggleEditBudget(categoryId) { this.editingBudget = this.editingBudget === categoryId ? null : categoryId; this.render(); }
    setBudgetPercentage(categoryId, pctStr) {
        const pct = parseFloat(pctStr) || 0;
        let b = this.getBudget(categoryId);
        this.editingBudget = null;
        if (!b) { b = { categoryId, percentage: pct }; this.budgets.push(b); }
        else { b.percentage = pct; }
        this.saveData(); this.render();
    }
    setBudget(categoryId, amount) {
        const amt = parseFloat(amount) || 0;
        let b = this.getBudget(categoryId);
        this.editingBudget = null;
        if (!b) { b = { categoryId, monthlyAmount: amt }; this.budgets.push(b); }
        else { b.monthlyAmount = amt; }
        this.saveData(); this.render();
    }

    // ---------- TASKS (Monthly recurring) ----------
    toggleAddTask() { this.addingTask = !this.addingTask; this.editingTask = null; this.render(); }
    toggleEditTask(id) { this.editingTask = this.editingTask === id ? null : id; this.render(); }
    saveTask(id, text, orderPos) {
        if (!text) return;
        const pos = Math.max(1, parseInt(orderPos) || (this.tasks.length + 1));
        if (id) {
            const idx = this.tasks.findIndex(x => x.id === id);
            if (idx === -1) return;
            const t = this.tasks[idx];
            t.text = text;
            this.tasks.splice(idx, 1);
            const insertAt = Math.min(pos - 1, this.tasks.length);
            this.tasks.splice(insertAt, 0, t);
            this.editingTask = null;
        } else {
            const t = { id: this.uid(), text, paidMonths: {} };
            const insertAt = Math.min(pos - 1, this.tasks.length);
            this.tasks.splice(insertAt, 0, t);
            this.addingTask = false;
        }
        this.saveData(); this.render();
    }
    deleteTask(id) {
        if (!confirm('Delete this recurring task?')) return;
        this.tasks = this.tasks.filter(t => t.id !== id);
        this.saveData(); this.render();
    }
    toggleTaskPaid(id) {
        const t = this.tasks.find(x => x.id === id);
        if (!t) return;
        const mk = this.monthKey();
        t.paidMonths = t.paidMonths || {};
        if (t.paidMonths[mk]) delete t.paidMonths[mk];
        else t.paidMonths[mk] = true;
        this.saveData(); this.render();
    }
    resetMonthlyTasks() {
        if (this.tasks.length === 0) return;
        if (!confirm('Reset all monthly tasks for ' + this.monthLabel(this.monthKey()) + '? This will untick everything for this month.')) return;
        const mk = this.monthKey();
        this.tasks.forEach(t => { if (t.paidMonths) delete t.paidMonths[mk]; });
        this.saveData(); this.render();
    }

    // ---------- TRACKING (monthly account balances) ----------
    shiftTrackingMonth(delta) { this.trackingMonth = this.shiftMonthKey(this.trackingMonth, delta); this.render(); }
    toggleEditTrackingBalance(accId) { this.editingTrackingBalance = this.editingTrackingBalance === accId ? null : accId; this.render(); }
    accountTracksInput(accId) {
        const acc = this.accounts.find(a => a.id === accId);
        if (!acc) return false;
        if (acc.isLISA) return true;
        const cat = this.accountCategories.find(c => c.id === acc.categoryId);
        return !!(cat && cat.trackInput);
    }
    saveMonthlyBalance(accountId, mk, balanceStr, inputStr, growthStr) {
        const balance = parseFloat(balanceStr);
        if (isNaN(balance)) return;
        let entry = this.entryAt(accountId, mk);
        if (!entry) { entry = { id: this.uid(), accountId, monthKey: mk, balance }; this.monthlyBalances.push(entry); }
        else entry.balance = balance;
        if (inputStr !== undefined && inputStr !== null) entry.input = parseFloat(inputStr) || 0;
        if (growthStr !== undefined && growthStr !== null) entry.growth = parseFloat(growthStr) || 0;
        this.editingTrackingBalance = null;
        this.saveData(); this.render();
    }
    totalInputForAccount(accountId) {
        return this.monthlyBalances.filter(e => e.accountId === accountId).reduce((s,e) => s + (parseFloat(e.input) || 0), 0);
    }
    trackedAccountsSummaryForTaxYear(startYear) {
        const months = this.taxYearMonths(startYear);
        const monthSet = new Set(months);
        const endMk = months[months.length - 1];
        const startBaselineMk = this.shiftMonthKey(months[0], -1);
        return this.accounts.filter(a => this.accountTracksInput(a.id)).map(a => {
            const entriesInYear = this.monthlyBalances.filter(e => e.accountId === a.id && monthSet.has(e.monthKey));
            const totalInput = entriesInYear.reduce((s,e) => s + (parseFloat(e.input) || 0), 0);
            const endBalance = this.balanceAsOf(a.id, endMk);
            const startBalance = this.balanceAsOf(a.id, startBaselineMk);
            let growth;
            if (a.manualGrowth) {
                growth = entriesInYear.reduce((s,e) => s + (e.growth !== undefined ? (parseFloat(e.growth) || 0) : 0), 0);
            } else {
                growth = endBalance - startBalance - totalInput;
            }
            return { name: a.name, totalInput, growth, endBalance };
        });
    }

    // ---------- REPORTING ----------
    totalBalance() { return this.accounts.reduce((s,a) => s + this.accountBalance(a.id), 0); }
    taxYearChangeSummary(startYear) {
        const months = this.taxYearMonths(startYear);
        const endMk = months[months.length - 1];
        const startBaselineMk = this.shiftMonthKey(months[0], -1);
        let totalChange = 0, recordedCount = 0;
        this.accounts.forEach(a => {
            const hasAnyEntryInYear = this.monthlyBalances.some(e => e.accountId === a.id && months.includes(e.monthKey));
            if (!hasAnyEntryInYear) return;
            const endBalance = this.balanceAsOf(a.id, endMk);
            const startBalance = this.balanceAsOf(a.id, startBaselineMk);
            totalChange += endBalance - startBalance;
            recordedCount++;
        });
        return { totalChange, recordedCount };
    }
    biggestChangesForTaxYear(startYear) {
        const months = this.taxYearMonths(startYear);
        const endMk = months[months.length - 1];
        const startBaselineMk = this.shiftMonthKey(months[0], -1);
        const rows = [];
        this.accounts.forEach(a => {
            const hasAnyEntryInYear = this.monthlyBalances.some(e => e.accountId === a.id && months.includes(e.monthKey));
            if (!hasAnyEntryInYear) return;
            const endBalance = this.balanceAsOf(a.id, endMk);
            const startBalance = this.balanceAsOf(a.id, startBaselineMk);
            rows.push({ name: a.name, change: endBalance - startBalance });
        });
        return rows.sort((a,b) => Math.abs(b.change) - Math.abs(a.change)).slice(0,5);
    }
    isaContributionsForTaxYear(startYear) {
        const months = new Set(this.taxYearMonths(startYear));
        const isaAccounts = this.accounts.filter(a => this.isISACategoryId(a.categoryId) || a.isLISA);
        return isaAccounts.reduce((sum,a) => sum + this.monthlyBalances.filter(e => e.accountId === a.id && months.has(e.monthKey)).reduce((s2,e) => s2 + (parseFloat(e.input) || 0), 0), 0);
    }
    savingsRateForTaxYear(startYear) {
        const cs = this.taxYearChangeSummary(startYear);
        const annualIncome = this.totalIncome() * 12;
        if (annualIncome <= 0 || cs.recordedCount === 0) return null;
        return (cs.totalChange / annualIncome) * 100;
    }
    monthlyTotalBalanceSeries(startYear) {
        return this.taxYearMonths(startYear).map(mk => ({ monthKey: mk, total: this.accounts.reduce((s,a) => s + this.balanceAsOf(a.id, mk), 0) }));
    }
    allMonthKeysSorted() {
        const s = new Set(this.monthlyBalances.map(e => e.monthKey));
        return Array.from(s).sort();
    }
    balanceAsOf(accountId, mk) {
        const acc = this.accounts.find(a => a.id === accountId);
        if (!acc) return 0;
        if (acc.openingMonth && mk < acc.openingMonth) return 0;
        const entry = this.entryAt(accountId, mk);
        if (entry) return entry.balance;
        const prev = this.latestEntryBefore(accountId, mk);
        if (prev) return prev.balance;
        return parseFloat(acc.startingBalance) || 0;
    }
    toggleReportCategoryExpand(id) { this.expandedReportCategories[id] = !this.expandedReportCategories[id]; this.render(); }
    categoryMonthlyTotals(categoryId) {
        const accIds = this.accounts.filter(a => a.categoryId === categoryId).map(a => a.id);
        const months = this.allMonthKeysSorted();
        if (accIds.length === 0 || months.length === 0) return [];
        let prevTotal = null;
        return months.map(mk => {
            const total = accIds.reduce((s,id) => s + this.balanceAsOf(id, mk), 0);
            const diff = prevTotal === null ? null : total - prevTotal;
            prevTotal = total;
            return { monthKey: mk, total, diff };
        });
    }
    exportCSV() {
        let csv = 'Month,Account,Account Category,Balance\n';
        this.monthlyBalances.slice().sort((a,b) => a.monthKey.localeCompare(b.monthKey) || a.accountId.localeCompare(b.accountId)).forEach(e => {
            const acc = this.accounts.find(a => a.id === e.accountId);
            const catName = acc ? this.accountCategoryName(acc.categoryId) : '';
            const row = [e.monthKey, acc?acc.name:'', catName, e.balance];
            csv += row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'money-tracker-export.csv'; a.click();
        URL.revokeObjectURL(url);
    }

    // ---------- RENDER: PLANNING ----------
    renderBudgetRow(c) {
        const b = this.getBudget(c.id);
        const isEditing = this.editingBudget === c.id || !b;
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<div class="flex items-center justify-between" style="color: var(--color-text);"><span class="font-medium">' + c.name + '</span>';
        if (c.percentageBased) {
            const pct = b ? (parseFloat(b.percentage) || 0) : 0;
            const amount = this.totalIncome() * (pct / 100);
            if (isEditing) {
                html += '<div class="flex items-center gap-2"><input id="bg_' + c.id + '" type="number" step="0.1" value="' + pct + '" class="w-16 px-2 py-1 rounded border text-sm" style="border-color: var(--color-border);"><span class="text-xs" style="color: var(--color-text-muted);">%</span><button onclick="window.app.setBudgetPercentage(\'' + c.id + '\', document.getElementById(\'bg_' + c.id + '\').value)" class="text-xs px-2 py-1 rounded text-white" style="background-color: var(--color-primary);">Save</button></div></div>';
            } else {
                html += '<div class="flex items-center gap-2"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(amount) + '</span><span class="text-xs" style="color: var(--color-text-muted);">(' + pct + '%)</span><button onclick="window.app.toggleEditBudget(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Edit</button></div></div>';
            }
        } else {
            const target = b ? b.monthlyAmount : 0;
            if (isEditing) {
                html += '<div class="flex items-center gap-2"><span class="text-xs" style="color: var(--color-text-muted);">£</span><input id="bg_' + c.id + '" type="number" step="0.01" value="' + target + '" class="w-20 px-2 py-1 rounded border text-sm" style="border-color: var(--color-border);"><button onclick="window.app.setBudget(\'' + c.id + '\', document.getElementById(\'bg_' + c.id + '\').value)" class="text-xs px-2 py-1 rounded text-white" style="background-color: var(--color-primary);">Save</button></div></div>';
            } else {
                html += '<div class="flex items-center gap-2"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(target) + '</span><button onclick="window.app.toggleEditBudget(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Edit</button></div></div>';
            }
        }
        html += '</div>';
        return html;
    }
    toggleGroupExpand(key) { this.expandedGroups[key] = !this.expandedGroups[key]; this.render(); }
    groupBudgetTotal(key) {
        return this.categories.filter(c => this.categoryGroup(c) === key)
            .reduce((sum, c) => {
                const b = this.getBudget(c.id);
                if (!b) return sum;
                if (c.percentageBased) return sum + this.totalIncome() * ((parseFloat(b.percentage) || 0) / 100);
                return sum + (parseFloat(b.monthlyAmount) || 0);
            }, 0);
    }
    colorForTargetDistance(distance) {
        // Green when within 2 points of target, grading toward red the further away.
        const green = [0,184,148], red = [255,71,87];
        const cap = 15;
        const t = distance <= 2 ? 0 : Math.min(1, (distance - 2) / (cap - 2));
        const rgb = [0,1,2].map(i => Math.round(green[i] + (red[i]-green[i]) * t));
        return 'rgb(' + rgb.join(',') + ')';
    }
    renderPlanningTab() {
        const totalIncome = this.totalIncome();
        let html = this.renderTasksSection();
        html += '<p class="text-sm mb-4 mt-4" style="color: var(--color-text-muted);">Check your amounts for each category then hit Save.</p>';
        if (totalIncome === 0) html += '<p class="text-sm mb-4 p-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Set your salary in ⚙️ Settings → Income to see each section&#8217;s share of income.</p>';

        const groups = [['essential','Essentials'],['saving','Savings'],['spending','Spending']];
        groups.forEach(([key,label]) => {
            const cats = this.categories.filter(c => this.categoryGroup(c) === key);
            if (cats.length === 0) return;
            const groupTotal = this.groupBudgetTotal(key);
            const pct = totalIncome > 0 ? (groupTotal / totalIncome) * 100 : null;
            const target = parseFloat(this.groupTargets[key]) || 0;
            const expanded = !!this.expandedGroups[key];

            let statusColor = 'var(--color-expense)';
            let targetText = '';
            if (pct !== null && target > 0) {
                const distance = Math.abs(pct - target);
                statusColor = this.colorForTargetDistance(distance);
                targetText = ' · target ' + target + '%' + (distance <= 2 ? ' ✓' : '');
            }

            html += '<button onclick="window.app.toggleGroupExpand(\'' + key + '\')" class="w-full flex items-center justify-between py-3 px-1 mt-3 border-b" style="border-color: var(--color-border);">';
            html += '<span class="text-sm font-bold uppercase" style="color: var(--color-text);">' + (expanded ? '▾ ' : '▸ ') + label + '</span>';
            html += '<span class="text-sm font-bold" style="color: ' + statusColor + ';">' + (pct !== null ? pct.toFixed(1) + '% of income' + targetText : this.fmt(groupTotal)) + '</span></button>';
            if (expanded) {
                cats.forEach(c => { html += this.renderBudgetRow(c); });
            }
        });

        if (this.categories.length === 0) html += '<p style="color: var(--color-text-muted);">No planning categories yet. Add one below.</p>';

        if (this.addingCategory) html += this.renderCategoryForm(null);
        else html += '<button onclick="window.app.toggleAddCategory()" class="w-full py-2 rounded-lg mt-4" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Planning Category</button>';
        return html;
    }

    // ---------- RENDER: TASKS ----------
    renderTasksSection() {
        const mk = this.monthKey();
        const expanded = !!this.expandedGroups.tasks;
        let html = '<button onclick="window.app.toggleGroupExpand(\'tasks\')" class="w-full flex items-center justify-between py-3 px-1 border-b" style="border-color: var(--color-border);">';
        html += '<span class="text-sm font-bold uppercase" style="color: var(--color-text);">' + (expanded ? '▾ ' : '▸ ') + 'Monthly Tasks</span>';
        html += '<button onclick="event.stopPropagation(); window.app.resetMonthlyTasks()" class="text-xs px-3 py-1 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">↻ Reset</button></button>';
        if (expanded) {
            if (this.tasks.length === 0) html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No monthly tasks yet. Add some in ⚙️ Settings → Monthly Tasks.</p>';
            this.tasks.forEach(t => {
                const paid = !!(t.paidMonths && t.paidMonths[mk]);
                html += '<label class="flex items-center gap-3 p-3 rounded-lg border mb-2 mt-2" style="background-color: var(--color-surface); border-color: var(--color-border); cursor: pointer;">';
                html += '<input type="checkbox" ' + (paid?'checked':'') + ' onchange="window.app.toggleTaskPaid(\'' + t.id + '\')" class="w-5 h-5 flex-shrink-0">';
                html += '<p class="flex-1" style="color: var(--color-text); ' + (paid?'text-decoration: line-through; opacity: 0.6;':'') + '">' + t.text + '</p>';
                html += '</label>';
            });
        }
        return html;
    }
    renderTaskForm(t) {
        const isEdit = !!t;
        const currentIdx = isEdit ? this.tasks.findIndex(x => x.id === t.id) : -1;
        const optionCount = isEdit ? this.tasks.length : this.tasks.length + 1;
        const defaultPos = isEdit ? currentIdx + 1 : optionCount;
        let html = '<div class="p-4 rounded-lg border mb-3" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<input id="tk_text" placeholder="Task (e.g. Enter salary, Adjust monthly figures)" value="' + (t?t.text:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Order</p>';
        let opts = '';
        for (let i = 1; i <= optionCount; i++) { opts += '<option value="' + i + '"' + (i===defaultPos?' selected':'') + '>' + i + '</option>'; }
        html += '<select id="tk_order" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">' + opts + '</select>';
        html += '<div class="flex gap-2"><button onclick="window.app.saveTask(' + (isEdit?"'"+t.id+"'":'null') + ', document.getElementById(\'tk_text\').value, document.getElementById(\'tk_order\').value)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditTask(\''+t.id+'\')':'toggleAddTask()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }

    // ---------- RENDER: TRACKING ----------
    accountCategoryColor(categoryId) {
        const palette = ['#0984E3','#6C5CE7','#00B894','#E17055','#D63031','#00CEC9','#FDCB6E','#E84393','#2D3436','#0FB9B1'];
        const idx = this.accountCategories.findIndex(c => c.id === categoryId);
        if (idx === -1) return '#636E72';
        return palette[idx % palette.length];
    }
    toggleTrackingCategoryExpand(id) { this.expandedTrackingCategories[id] = !this.expandedTrackingCategories[id]; this.render(); }
    renderTrackingAccountRow(a, mk, color) {
        if (a.openingMonth && mk < a.openingMonth) {
            return '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);"><span class="font-medium" style="color: var(--color-text);">' + a.name + '</span><p class="text-xs mt-1" style="color: var(--color-text-muted);">Starts ' + this.monthLabel(a.openingMonth) + '</p></div>';
        }
        const entry = this.entryAt(a.id, mk);
        const prev = this.latestEntryBefore(a.id, mk);
        const baseline = prev ? prev.balance : (parseFloat(a.startingBalance) || 0);
        const diff = entry ? entry.balance - baseline : null;
        const tracksInput = this.accountTracksInput(a.id);
        const manualGrowth = tracksInput && !!a.manualGrowth;
        const isEditing = this.editingTrackingBalance === a.id || !entry;
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<div class="flex items-center justify-between mb-2"><div><span class="font-medium" style="color: var(--color-text);">' + a.name + '</span>' + (a.isaType ? ' <span class="text-xs" style="color: var(--color-text-muted);">(' + this.isaTypeLabel(a.isaType) + ')</span>' : '') + (a.isLISA ? ' <span class="text-xs" style="color: var(--color-text-muted);">(LISA)</span>' : '') + '</div></div>';
        if (isEditing) {
            html += '<div class="flex items-center gap-2 mb-2"><span class="text-xs" style="color: var(--color-text-muted); width: 90px;">Balance £</span><input id="tb_' + a.id + '" type="number" step="0.01" value="' + (entry ? entry.balance : '') + '" placeholder="' + this.fmt(baseline) + '" class="flex-1 px-2 py-1 rounded border text-sm" style="border-color: var(--color-border);"></div>';
            if (tracksInput) {
                html += '<div class="flex items-center gap-2 mb-2"><span class="text-xs" style="color: var(--color-text-muted); width: 90px;">Put in £</span><input id="ti_' + a.id + '" type="number" step="0.01" value="' + (entry && entry.input !== undefined ? entry.input : '') + '" placeholder="0.00" class="flex-1 px-2 py-1 rounded border text-sm" style="border-color: var(--color-border);"></div>';
            }
            if (manualGrowth) {
                html += '<div class="flex items-center gap-2 mb-2"><span class="text-xs" style="color: var(--color-text-muted); width: 90px;">Growth £</span><input id="tg_' + a.id + '" type="number" step="0.01" value="' + (entry && entry.growth !== undefined ? entry.growth : '') + '" placeholder="0.00" class="flex-1 px-2 py-1 rounded border text-sm" style="border-color: var(--color-border);"></div>';
            }
            html += '<button onclick="window.app.saveMonthlyBalance(\'' + a.id + '\', \'' + mk + '\', document.getElementById(\'tb_' + a.id + '\').value' + (tracksInput ? ", document.getElementById('ti_" + a.id + "').value" : ', null') + (manualGrowth ? ", document.getElementById('tg_" + a.id + "').value" : '') + ')" class="text-xs px-3 py-2 rounded text-white w-full" style="background-color: ' + color + ';">Save</button>';
        } else {
            html += '<div class="flex items-center justify-between mb-1"><span class="text-xs" style="color: var(--color-text-muted);">Balance</span><div class="flex items-center gap-2"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(entry.balance) + '</span><button onclick="window.app.toggleEditTrackingBalance(\'' + a.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Edit</button></div></div>';
            if (tracksInput) {
                html += '<div class="flex items-center justify-between"><span class="text-xs" style="color: var(--color-text-muted);">Put in</span><span class="text-sm" style="color: var(--color-text);">' + this.fmt(entry.input !== undefined ? entry.input : 0) + '</span></div>';
            }
            if (manualGrowth) {
                html += '<div class="flex items-center justify-between"><span class="text-xs" style="color: var(--color-text-muted);">Growth</span><span class="text-sm" style="color: var(--color-text);">' + this.fmt(entry.growth !== undefined ? entry.growth : 0) + '</span></div>';
            }
        }
        if (diff !== null) {
            if (tracksInput) {
                const monthInput = (entry.input !== undefined) ? (parseFloat(entry.input) || 0) : 0;
                const growth = manualGrowth && entry.growth !== undefined ? (parseFloat(entry.growth) || 0) : (diff - monthInput);
                const growthNote = manualGrowth && entry.growth !== undefined ? ' (manual)' : '';
                html += '<p class="text-xs mt-2" style="color: ' + (diff >= 0 ? 'var(--color-success)' : 'var(--color-error)') + ';">' + this.fmtSigned(diff) + ' vs ' + (prev ? this.monthLabel(prev.monthKey) : 'opening balance') + ' — ' + this.fmt(monthInput) + ' put in, ' + this.fmtSigned(growth) + ' growth' + growthNote + '</p>';
            } else {
                html += '<p class="text-xs mt-2" style="color: ' + (diff >= 0 ? 'var(--color-success)' : 'var(--color-error)') + ';">' + this.fmtSigned(diff) + ' vs ' + (prev ? this.monthLabel(prev.monthKey) : 'opening balance') + '</p>';
            }
        }
        html += '</div>';
        return html;
    }
    groupMonthDiff(accounts, mk) {
        const prevMk = this.shiftMonthKey(mk, -1);
        let total = 0, baseline = 0, anyEntry = false;
        accounts.forEach(a => {
            if (a.openingMonth && mk < a.openingMonth) return;
            if (this.entryAt(a.id, mk)) anyEntry = true;
            total += this.balanceAsOf(a.id, mk);
            baseline += this.balanceAsOf(a.id, prevMk);
        });
        return anyEntry ? (total - baseline) : null;
    }
    // ---------- MONTHLY REVIEW ----------
    shiftReviewMonth(delta) { this.reviewMonth = this.shiftMonthKey(this.reviewMonth, delta); this.render(); }
    saveMonthlyComment(mk, text) { this.monthlyComments[mk] = text; this.saveData(); this.render(); }
    monthTotalAndDiff(accounts, mk) {
        const prevMk = this.shiftMonthKey(mk, -1);
        const total = accounts.reduce((s,a) => s + this.balanceAsOf(a.id, mk), 0);
        const prevTotal = accounts.reduce((s,a) => s + this.balanceAsOf(a.id, prevMk), 0);
        return { total, diff: total - prevTotal };
    }
    changeArrow(diff) {
        if (diff === 0) return '';
        const up = diff >= 0;
        return ' <span style="color: ' + (up ? 'var(--color-success)' : 'var(--color-error)') + ';">' + (up ? '▲' : '▼') + '</span>';
    }
    renderMonthlyReviewSection() {
        const mk = this.reviewMonth;
        let html = '<div class="flex items-center justify-between mb-3">';
        html += '<button onclick="window.app.shiftReviewMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">‹</button>';
        html += '<p class="font-bold" style="color: var(--color-text);">Monthly Review — ' + this.monthLabel(mk) + '</p>';
        html += '<button onclick="window.app.shiftReviewMonth(1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">›</button>';
        html += '</div>';

        if (this.accounts.length === 0) {
            html += '<p class="text-center py-6" style="color: var(--color-text-muted);">No accounts yet.</p>';
            return html;
        }

        const overall = this.monthTotalAndDiff(this.accounts, mk);
        html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<p class="text-xs font-bold mb-1" style="color: var(--color-accent); text-transform: uppercase;">Overall Wealth</p>';
        html += '<p class="text-2xl font-bold" style="color: var(--color-text);">' + this.fmt(overall.total) + '</p>';
        html += '<p class="text-sm mt-1" style="color: ' + (overall.diff>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(overall.diff) + this.changeArrow(overall.diff) + ' vs ' + this.monthLabel(this.shiftMonthKey(mk,-1)) + '</p>';
        html += '</div>';

        const groups = [];
        this.accountCategories.forEach(cat => {
            const accs = this.accounts.filter(a => a.categoryId === cat.id);
            if (accs.length) groups.push({ name: cat.name, accounts: accs });
        });
        const uncategorised = this.accounts.filter(a => !this.accountCategories.some(c => c.id === a.categoryId));
        if (uncategorised.length) groups.push({ name: 'Uncategorised', accounts: uncategorised });

        html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">By Category</p>';
        groups.forEach((g,idx) => {
            const gd = this.monthTotalAndDiff(g.accounts, mk);
            html += '<div class="flex items-center justify-between pb-2' + (idx < groups.length-1?' border-b mb-2':'') + '" style="' + (idx < groups.length-1?'border-color: var(--color-border);':'') + '">';
            html += '<span style="color: var(--color-text);">' + g.name + '</span>';
            html += '<div class="text-right"><p class="font-bold" style="color: var(--color-text);">' + this.fmt(gd.total) + '</p><p class="text-xs" style="color: ' + (gd.diff>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(gd.diff) + this.changeArrow(gd.diff) + '</p></div>';
            html += '</div>';
        });
        html += '</div>';

        const comment = this.monthlyComments[mk] || '';
        html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-2" style="color: var(--color-text-muted); text-transform: uppercase;">Comment</p>';
        html += '<textarea id="review_comment_' + mk + '" placeholder="How did this month go?" class="w-full px-3 py-2 rounded border text-sm" style="border-color: var(--color-border); min-height: 80px;">' + comment + '</textarea>';
        html += '<button onclick="window.app.saveMonthlyComment(\'' + mk + '\', document.getElementById(\'review_comment_' + mk + '\').value)" class="w-full mt-2 py-2 rounded text-white" style="background-color: var(--color-primary);">Save Comment</button>';
        html += '</div>';
        return html;
    }
    renderTrackingTab() {
        const mk = this.trackingMonth;
        let html = '<div class="flex items-center justify-between mb-4">';
        html += '<button onclick="window.app.shiftTrackingMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">‹</button>';
        html += '<p class="font-bold" style="color: var(--color-text);">' + this.monthLabel(mk) + '</p>';
        html += '<button onclick="window.app.shiftTrackingMonth(1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">›</button>';
        html += '</div>';

        if (this.accounts.length === 0) {
            html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No accounts yet. Add one below.</p>';
        } else {
            const groups = [];
            this.accountCategories.forEach(cat => {
                const accs = this.accounts.filter(a => a.categoryId === cat.id);
                if (accs.length) groups.push({ id: cat.id, name: cat.name, color: this.accountCategoryColor(cat.id), accounts: accs });
            });
            const uncategorised = this.accounts.filter(a => !this.accountCategories.some(c => c.id === a.categoryId));
            if (uncategorised.length) groups.push({ id: '__uncategorised', name: 'Uncategorised', color: this.accountCategoryColor(''), accounts: uncategorised });

            groups.forEach(g => {
                const total = g.accounts.reduce((s,a) => s + this.balanceAsOf(a.id, mk), 0);
                const diff = this.groupMonthDiff(g.accounts, mk);
                const expanded = !!this.expandedTrackingCategories[g.id];
                let arrow = '';
                if (diff !== null && diff !== 0) {
                    arrow = ' <span style="color: ' + (diff >= 0 ? 'var(--color-success)' : 'var(--color-error)') + ';">' + (diff >= 0 ? '▲' : '▼') + '</span>';
                }
                html += '<button onclick="window.app.toggleTrackingCategoryExpand(\'' + g.id + '\')" class="w-full flex items-center justify-between py-3 px-1 mt-3 border-b" style="border-color: var(--color-border);">';
                html += '<span class="text-sm font-bold uppercase flex items-center gap-2" style="color: var(--color-text);">' + (expanded ? '▾ ' : '▸ ') + '<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:' + g.color + ';"></span>' + g.name + '</span>';
                html += '<span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(total) + arrow + '</span></button>';
                if (expanded) {
                    g.accounts.forEach(a => { html += this.renderTrackingAccountRow(a, mk, g.color); });
                }
            });
        }

        if (this.addingAccount) html += this.renderAccountForm(null);
        else html += '<button onclick="window.app.toggleAddAccount()" class="w-full py-2 rounded-lg mt-4" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Account</button>';
        return html;
    }

    // ---------- RENDER: REPORTING ----------
    renderMonthlyByCategorySection(taxYearMonthSet) {
        const cats = this.accountCategories.filter(c => this.accounts.some(a => a.categoryId === c.id));
        if (cats.length === 0) return '';
        let html = '<p class="text-xs font-bold mb-2 mt-1" style="color: var(--color-text-muted); text-transform: uppercase;">Month by Month by Category</p>';
        cats.forEach(cat => {
            const rows = this.categoryMonthlyTotals(cat.id).filter(r => taxYearMonthSet.has(r.monthKey)).slice().reverse();
            if (rows.length === 0) return;
            const expanded = !!this.expandedReportCategories[cat.id];
            html += '<button onclick="window.app.toggleReportCategoryExpand(\'' + cat.id + '\')" class="w-full flex items-center justify-between p-3 rounded-lg border mb-1" style="background-color: var(--color-surface); border-color: var(--color-border);">';
            html += '<span class="font-medium" style="color: var(--color-text);">' + (expanded?'▾ ':'▸ ') + cat.name + '</span>';
            html += '<span class="font-bold" style="color: var(--color-text);">' + this.fmt(rows[0].total) + '</span></button>';
            if (expanded) {
                html += '<div class="mb-2">';
                rows.forEach((r,idx) => {
                    html += '<div class="flex items-center justify-between p-2 pl-4' + (idx < rows.length-1?' border-b':'') + '" style="' + (idx < rows.length-1?'border-color: var(--color-border);':'') + '"><span class="text-xs" style="color: var(--color-text-muted);">' + this.monthLabel(r.monthKey) + '</span><div class="flex items-center gap-2"><span class="text-sm" style="color: var(--color-text);">' + this.fmt(r.total) + '</span>' + (r.diff !== null ? '<span class="text-xs" style="color: ' + (r.diff>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(r.diff) + '</span>' : '') + '</div></div>';
                });
                html += '</div>';
            }
        });
        return html;
    }
    renderBalanceTrendSection(startYear) {
        const series = this.monthlyTotalBalanceSeries(startYear);
        const hasData = series.some(s => s.total !== 0);
        if (!hasData) return '';
        const max = Math.max(...series.map(s => s.total), 1);
        const min = Math.min(...series.map(s => s.total), 0);
        const range = (max - min) || 1;
        let html = '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Balance Trend</p>';
        html += '<div class="flex items-end gap-1" style="height: 80px;">';
        series.forEach(s => {
            const heightPct = Math.max(4, ((s.total - min) / range) * 100);
            html += '<div class="flex-1 flex flex-col items-center justify-end h-full"><div style="width: 100%; height: ' + heightPct + '%; background-color: var(--color-primary); border-radius: 3px 3px 0 0;"></div></div>';
        });
        html += '</div>';
        html += '<div class="flex gap-1 mt-1">';
        series.forEach(s => { html += '<div class="flex-1 text-center" style="font-size: 9px; color: var(--color-text-muted);">' + this.monthLabel(s.monthKey).slice(0,3) + '</div>'; });
        html += '</div>';
        html += '<p class="text-xs mt-2" style="color: var(--color-text-muted);">' + this.fmt(series[0].total) + ' → ' + this.fmt(series[series.length-1].total) + '</p>';
        html += '</div>';
        return html;
    }
    renderSavingsRateSection(startYear) {
        const rate = this.savingsRateForTaxYear(startYear);
        if (rate === null) return '';
        const target = parseFloat(this.groupTargets.saving) || 0;
        let html = '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<p class="text-xs font-bold mb-1" style="color: var(--color-text-muted); text-transform: uppercase;">Savings Rate</p>';
        let color = 'var(--color-text)';
        let targetText = '';
        if (target > 0) {
            const distance = Math.abs(rate - target);
            color = this.colorForTargetDistance(distance);
            targetText = ' · target ' + target + '%' + (distance <= 2 ? ' ✓' : '');
        }
        html += '<p class="text-2xl font-bold" style="color: ' + color + ';">' + rate.toFixed(1) + '%' + targetText + '</p>';
        html += '<p class="text-xs mt-1" style="color: var(--color-text-muted);">Share of your income kept as balance growth this tax year</p>';
        html += '</div>';
        return html;
    }
    renderISAAllowanceSection(startYear) {
        const hasISA = this.accounts.some(a => this.isISACategoryId(a.categoryId) || a.isLISA);
        if (!hasISA) return '';
        const allowance = 20000;
        const used = this.isaContributionsForTaxYear(startYear);
        const pct = Math.min(100, (used / allowance) * 100);
        const color = used > allowance ? 'var(--color-error)' : (pct >= 90 ? 'var(--color-warning)' : 'var(--color-success)');
        let html = '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<p class="text-xs font-bold mb-1" style="color: var(--color-text-muted); text-transform: uppercase;">ISA Allowance</p>';
        html += '<p class="text-lg font-bold mb-2" style="color: var(--color-text);">' + this.fmt(used) + ' of ' + this.fmt(allowance) + '</p>';
        html += '<div class="w-full rounded-full h-2" style="background-color: var(--color-border);"><div class="h-2 rounded-full" style="width: ' + pct + '%; background-color: ' + color + ';"></div></div>';
        html += '</div>';
        return html;
    }
    renderYearOverYearSection(startYear) {
        const thisYear = this.taxYearChangeSummary(startYear);
        const lastYear = this.taxYearChangeSummary(startYear - 1);
        if (thisYear.recordedCount === 0 && lastYear.recordedCount === 0) return '';
        let html = '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Year on Year</p>';
        html += '<div class="grid grid-cols-2 gap-3">';
        html += '<div><p class="text-xs" style="color: var(--color-text-muted);">' + this.taxYearLabel(startYear - 1) + '</p><p class="font-bold" style="color: ' + (lastYear.recordedCount>0 ? (lastYear.totalChange>=0?'var(--color-success)':'var(--color-error)') : 'var(--color-text-muted)') + ';">' + (lastYear.recordedCount>0 ? this.fmtSigned(lastYear.totalChange) : '—') + '</p></div>';
        html += '<div><p class="text-xs" style="color: var(--color-text-muted);">' + this.taxYearLabel(startYear) + '</p><p class="font-bold" style="color: ' + (thisYear.recordedCount>0 ? (thisYear.totalChange>=0?'var(--color-success)':'var(--color-error)') : 'var(--color-text-muted)') + ';">' + (thisYear.recordedCount>0 ? this.fmtSigned(thisYear.totalChange) : '—') + '</p></div>';
        html += '</div></div>';
        return html;
    }
    renderReportingTab() {
        let html = this.renderMonthlyReviewSection();
        html += '<div class="border-t pt-4 mt-2" style="border-color: var(--color-border);"></div>';
        const startYear = this.reportingTaxYear;
        const cs = this.taxYearChangeSummary(startYear);
        html += '<div class="flex items-center justify-between mb-3">';
        html += '<button onclick="window.app.shiftReportingTaxYear(-1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">‹</button>';
        html += '<p class="font-bold" style="color: var(--color-text);">Tax Year ' + this.taxYearLabel(startYear) + '</p>';
        html += '<button onclick="window.app.shiftReportingTaxYear(1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">›</button>';
        html += '</div>';
        html += '<div class="grid grid-cols-2 gap-3 mb-4">';
        html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: var(--color-accent); text-transform: uppercase;">Total Balance</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + this.fmt(this.totalBalance()) + '</p></div>';
        if (cs.recordedCount > 0) {
            html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-1" style="color: ' + (cs.totalChange>=0?'var(--color-success)':'var(--color-error)') + '; text-transform: uppercase;">Change This Tax Year</p><p class="text-2xl font-bold" style="color: var(--color-text);">' + this.fmtSigned(cs.totalChange) + '</p></div>';
        } else {
            html += '<div class="p-4 rounded-lg border flex items-center" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">No balances recorded yet this tax year — add them on the Tracking tab.</p></div>';
        }
        html += '</div>';

        html += this.renderBalanceTrendSection(startYear);
        html += this.renderSavingsRateSection(startYear);
        html += this.renderISAAllowanceSection(startYear);
        html += this.renderYearOverYearSection(startYear);

        html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Accounts</p>';
        if (this.accounts.length === 0) html += '<p style="color: var(--color-text-muted); font-size: 14px;">No accounts yet.</p>';
        this.accounts.forEach((a,idx) => {
            html += '<div class="flex items-center justify-between pb-2' + (idx < this.accounts.length-1?' border-b':'') + ' mb-2" style="' + (idx < this.accounts.length-1?'border-color: var(--color-border);':'') + '"><span style="color: var(--color-text);">' + a.name + ' <span class="text-xs" style="color: var(--color-text-muted);">(' + this.accountCategoryName(a.categoryId) + ')</span></span><span class="font-bold" style="color: var(--color-text);">' + this.fmt(this.accountBalance(a.id)) + '</span></div>';
        });
        html += '</div>';

        const taxYearMonthSet = new Set(this.taxYearMonths(startYear));
        html += this.renderMonthlyByCategorySection(taxYearMonthSet);

        const changes = this.biggestChangesForTaxYear(startYear);
        if (changes.length > 0) {
            html += '<div class="p-4 rounded-lg border mb-4" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Biggest Changes This Tax Year</p>';
            changes.forEach((c,idx) => {
                html += '<div class="flex items-center justify-between pb-2' + (idx < changes.length-1?' border-b':'') + '" style="' + (idx < changes.length-1?'border-color: var(--color-border);':'') + '"><span style="color: var(--color-text);">' + c.name + '</span><span class="font-bold" style="color: ' + (c.change>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(c.change) + '</span></div>';
            });
            html += '</div>';
        }

        const tracked = this.trackedAccountsSummaryForTaxYear(startYear);
        if (tracked.length > 0) {
            html += '<div class="p-4 rounded-lg border" style="background-color: var(--color-surface); border-color: var(--color-border);"><p class="text-xs font-bold mb-3" style="color: var(--color-text-muted); text-transform: uppercase;">Contributions & Growth (' + this.taxYearLabel(startYear) + ')</p>';
            tracked.forEach((t,idx) => {
                html += '<div class="pb-2' + (idx < tracked.length-1?' border-b mb-2':'') + '" style="' + (idx < tracked.length-1?'border-color: var(--color-border);':'') + '"><p style="color: var(--color-text);">' + t.name + '</p><div class="flex items-center justify-between text-xs" style="color: var(--color-text-muted);"><span>' + this.fmt(t.totalInput) + ' put in</span><span style="color: ' + (t.growth>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(t.growth) + ' growth</span></div></div>';
            });
            html += '</div>';
        }
        return html;
    }

    // ---------- RENDER: SETTINGS ----------
    renderSettings() {
        let html = '<div class="max-w-4xl mx-auto px-4 py-4 border-t" style="border-color: var(--color-border); background-color: var(--color-surface);"><h3 class="font-semibold mb-3" style="color: var(--color-text);">Settings</h3>';
        html += '<div class="flex gap-2 mb-4 flex-wrap">';
        html += '<button onclick="window.app.settingsSection=\'accounts\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='accounts'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='accounts'?'var(--color-primary-text)':'var(--color-text)') + ';">Accounts</button>';
        html += '<button onclick="window.app.settingsSection=\'accountCategories\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='accountCategories'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='accountCategories'?'var(--color-primary-text)':'var(--color-text)') + ';">Account Categories</button>';
        html += '<button onclick="window.app.settingsSection=\'categories\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='categories'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='categories'?'var(--color-primary-text)':'var(--color-text)') + ';">Planning Categories</button>';
        html += '<button onclick="window.app.settingsSection=\'income\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='income'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='income'?'var(--color-primary-text)':'var(--color-text)') + ';">Income</button>';
        html += '<button onclick="window.app.settingsSection=\'tasks\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection==='tasks'?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection==='tasks'?'var(--color-primary-text)':'var(--color-text)') + ';">Monthly Tasks</button>';
        html += '<button onclick="window.app.exportCSV()" class="px-3 py-1 rounded-full text-sm" style="background-color: var(--color-bg); color: var(--color-text);">📥 Export CSV</button></div>';

        if (this.settingsSection === 'accounts') {
            if (this.addingAccount) html += this.renderAccountForm(null);
            this.accounts.forEach(a => {
                if (this.editingAccount === a.id) { html += this.renderAccountForm(a); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span style="color: var(--color-text);">' + a.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(' + this.accountCategoryName(a.categoryId) + (a.isaType ? ' · ' + this.isaTypeLabel(a.isaType) : '') + (a.isLISA ? ' · LISA' : '') + ', opens ' + this.fmt(a.startingBalance) + (a.openingMonth ? ' as of ' + this.monthLabel(a.openingMonth) : '') + ')</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditAccount(\'' + a.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteAccount(\'' + a.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingAccount) html += '<button onclick="window.app.toggleAddAccount()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Account</button>';
        } else if (this.settingsSection === 'accountCategories') {
            if (this.addingAccountCategory) html += this.renderAccountCategoryForm(null);
            this.accountCategories.forEach(c => {
                if (this.editingAccountCategory === c.id) { html += this.renderAccountCategoryForm(c); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><span style="color: var(--color-text);">' + c.name + (c.trackInput ? ' <span class="text-xs" style="color: var(--color-text-muted);">(tracks input)</span>' : '') + '</span><div class="flex gap-1"><button onclick="window.app.toggleEditAccountCategory(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteAccountCategory(\'' + c.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingAccountCategory) html += '<button onclick="window.app.toggleAddAccountCategory()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Account Category</button>';
        } else if (this.settingsSection === 'categories') {
            if (this.addingCategory) html += this.renderCategoryForm(null);
            this.categories.forEach(c => {
                if (this.editingCategory === c.id) { html += this.renderCategoryForm(c); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span style="color: var(--color-text);">' + c.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(' + this.categoryGroup(c) + (c.percentageBased ? ', %-based' : '') + ')</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditCategory(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteCategory(\'' + c.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingCategory) html += '<button onclick="window.app.toggleAddCategory()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Planning Category</button>';
        } else if (this.settingsSection === 'income') {
            html += this.renderIncomeSettings();
        } else if (this.settingsSection === 'tasks') {
            if (this.addingTask) html += this.renderTaskForm(null);
            this.tasks.forEach((t, idx) => {
                if (this.editingTask === t.id) { html += this.renderTaskForm(t); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span class="text-xs" style="color: var(--color-text-muted);">' + (idx+1) + '.</span> <span style="color: var(--color-text);">' + t.text + '</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditTask(\'' + t.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteTask(\'' + t.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingTask) html += '<button onclick="window.app.toggleAddTask()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Monthly Task</button>';
        }
        html += '<button onclick="window.app.toggleSettings()" class="w-full mt-4 py-2 rounded-lg" style="background-color: var(--color-secondary); color: var(--color-text);">Close Settings</button></div>';
        return html;
    }
    renderAccountForm(a) {
        const isEdit = !!a;
        const categoryUI = this.accountFormCategoryUI !== undefined && this.accountFormCategoryUI !== '' ? this.accountFormCategoryUI : (a ? a.categoryId : (this.accountCategories[0] ? this.accountCategories[0].id : ''));
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<input id="ac_name" placeholder="Account name" value="' + (a?a.name:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        if (this.accountCategories.length === 0) {
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">Add an account category first in Settings → Account Categories.</p>';
            html += '<input type="hidden" id="ac_category" value="">';
        } else {
            html += '<select id="ac_category" onchange="window.app.setAccountFormCategory(this.value)" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">' + this.accountCategories.map(c => '<option value="' + c.id + '"' + (categoryUI===c.id?' selected':'') + '>' + c.name + '</option>').join('') + '</select>';
        }
        let isaTypeArg = 'null';
        if (this.isISACategoryId(categoryUI)) {
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">ISA type</p>';
            html += '<select id="ac_isatype" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);"><option value="cash"' + (a && a.isaType==='cash'?' selected':'') + '>Cash</option><option value="stocks_and_shares"' + (a && a.isaType==='stocks_and_shares'?' selected':'') + '>Stocks and Shares</option></select>';
            isaTypeArg = "document.getElementById('ac_isatype').value";
        }
        let lisaArg = 'false';
        if (this.isPensionCategoryId(categoryUI)) {
            html += '<label class="flex items-center gap-2 mb-2" style="color: var(--color-text);"><input id="ac_lisa" type="checkbox" ' + (this.accountFormLISAUI ? 'checked' : '') + ' onchange="window.app.setAccountFormLISA(this.checked)"> LISA?</label>';
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">If ticked, contributions here also count toward your ISA allowance, even though this account stays categorised as Pensions.</p>';
            lisaArg = "document.getElementById('ac_lisa').checked";
        }
        let manualGrowthArg = 'false';
        if (this.accountWillTrackInput(categoryUI, this.accountFormLISAUI)) {
            html += '<label class="flex items-center gap-2 mb-2" style="color: var(--color-text);"><input id="ac_manualgrowth" type="checkbox" ' + (a && a.manualGrowth ? 'checked' : '') + '> Enter interest/growth manually?</label>';
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">If ticked, you will type the interest/growth each month on Tracking instead of it being calculated as balance change minus what you put in.</p>';
            manualGrowthArg = "document.getElementById('ac_manualgrowth').checked";
        }
        html += '<input id="ac_start" type="number" step="0.01" placeholder="Opening balance £" value="' + (a?a.startingBalance:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Opening balance as of</p>';
        html += '<input id="ac_openingmonth" type="month" value="' + (a && a.openingMonth ? a.openingMonth : this.monthKey()) + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">The tracker will not ask for balances before this month.</p>';
        html += '<div class="flex gap-2"><button onclick="window.app.saveAccount(' + (isEdit?"'"+a.id+"'":'null') + ', document.getElementById(\'ac_name\').value, document.getElementById(\'ac_category\').value, document.getElementById(\'ac_start\').value, ' + isaTypeArg + ', document.getElementById(\'ac_openingmonth\').value, ' + lisaArg + ', ' + manualGrowthArg + ')" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditAccount(\''+a.id+'\')':'toggleAddAccount()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }
    renderAccountCategoryForm(c) {
        const isEdit = !!c;
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<input id="acc_name" placeholder="Account category name (e.g. Bank, Investment)" value="' + (c?c.name:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<label class="flex items-center gap-2 mb-2" style="color: var(--color-text);"><input id="acc_trackinput" type="checkbox" ' + (c && c.trackInput ? 'checked' : '') + '> Track amount put in / interest gained for this category</label>';
        html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">Useful for things like ISAs — track deposits separately from balance growth.</p>';
        html += '<div class="flex gap-2"><button onclick="window.app.saveAccountCategory(' + (isEdit?"'"+c.id+"'":'null') + ', document.getElementById(\'acc_name\').value, document.getElementById(\'acc_trackinput\').checked)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditAccountCategory(\''+c.id+'\')':'toggleAddAccountCategory()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }
    renderIncomeSettings() {
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Salary (monthly, £)</p>';
        html += '<input id="inc_salary" type="number" step="0.01" placeholder="e.g. 2500" value="' + (this.income.salary || '') + '" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">';
        html += '<label class="flex items-center gap-2 mb-3" style="color: var(--color-text);"><input id="inc_other_toggle" type="checkbox" ' + (this.otherIncomeUIEnabled ? 'checked' : '') + ' onchange="window.app.toggleOtherIncomeUI(this.checked)"> Other income?</label>';
        if (this.otherIncomeUIEnabled) {
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Other income (monthly, £)</p>';
            html += '<input id="inc_other_amount" type="number" step="0.01" placeholder="e.g. 200" value="' + (this.income.otherIncomeAmount || '') + '" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">';
        }
        html += '<button onclick="window.app.saveIncomeSettings(document.getElementById(\'inc_salary\').value, document.getElementById(\'inc_other_toggle\').checked, ' + (this.otherIncomeUIEnabled ? "document.getElementById('inc_other_amount').value" : '0') + ')" class="w-full py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '</div>';
        html += '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<p class="text-sm font-semibold mb-2" style="color: var(--color-text);">Planning Targets</p>';
        html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">The % of income you are aiming for in each Planning section. Shown on the Planning tab headlines.</p>';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Essential %</p><input id="gt_essential" type="number" step="1" value="' + this.groupTargets.essential + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Saving %</p><input id="gt_saving" type="number" step="1" value="' + this.groupTargets.saving + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Spending %</p><input id="gt_spending" type="number" step="1" value="' + this.groupTargets.spending + '" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">';
        html += '<button onclick="window.app.saveGroupTargets(document.getElementById(\'gt_essential\').value, document.getElementById(\'gt_saving\').value, document.getElementById(\'gt_spending\').value)" class="w-full py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '</div>';
        return html;
    }
    renderCategoryForm(c) {
        const isEdit = !!c;
        const groupUI = this.categoryFormGroupUI || (c ? this.categoryGroup(c) : 'spending');
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<input id="ca_name" placeholder="Planning category name" value="' + (c?c.name:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Group</p>';
        html += '<select id="ca_group" onchange="window.app.setCategoryFormGroup(this.value)" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);"><option value="essential"' + (groupUI==='essential'?' selected':'') + '>Essential</option><option value="saving"' + (groupUI==='saving'?' selected':'') + '>Saving</option><option value="spending"' + (groupUI==='spending'?' selected':'') + '>Spending</option></select>';
        let pctBasedArg = 'false';
        if (groupUI === 'saving') {
            html += '<label class="flex items-center gap-2 mb-2" style="color: var(--color-text);"><input id="ca_pctbased" type="checkbox" ' + (c && c.percentageBased ? 'checked' : '') + '> Percentage-based?</label>';
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">If yes, you will set a % of income for this category on the Planning tab instead of a fixed amount.</p>';
            pctBasedArg = "document.getElementById('ca_pctbased').checked";
        }
        html += '<div class="flex gap-2"><button onclick="window.app.saveCategory(' + (isEdit?"'"+c.id+"'":'null') + ', document.getElementById(\'ca_name\').value, document.getElementById(\'ca_group\').value, ' + pctBasedArg + ')" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditCategory(\''+c.id+'\')':'toggleAddCategory()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }

    toggleSettings() { this.showSettings = !this.showSettings; this.render(); }

    render() {
        let content = '';
        if (this.currentTab === 'planning') content = this.renderPlanningTab();
        else if (this.currentTab === 'tracking') content = this.renderTrackingTab();
        else if (this.currentTab === 'reporting') content = this.renderReportingTab();

        const tabs = [['planning','Planning'],['tracking','Tracking'],['reporting','Reporting']];
        let tabsHtml = tabs.map(([key,label]) => '<button onclick="window.app.currentTab = \'' + key + '\'; window.app.render()" class="py-3 px-4 font-medium text-sm whitespace-nowrap" style="color: ' + (this.currentTab===key?'var(--color-primary)':'var(--color-text-muted)') + '; border-bottom: 2px solid ' + (this.currentTab===key?'var(--color-primary)':'transparent') + ';">' + label + '</button>').join('');

        const html = '<div style="background-color: var(--color-bg); min-height: 100vh;"><div class="sticky top-0 z-50" style="background-color: var(--color-surface); border-bottom: 1px solid var(--color-border);"><div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between"><h1 class="text-2xl font-bold" style="color: var(--color-text);">💷 Money Tracker</h1><div class="flex gap-2"><button onclick="window.app.toggleSettings()" class="w-10 h-10 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">⚙️</button></div></div>' + (this.showSettings ? this.renderSettings() : '') + '<div class="max-w-4xl mx-auto px-4 flex gap-2 border-t overflow-x-auto" style="border-color: var(--color-border);">' + tabsHtml + '</div></div><div class="max-w-4xl mx-auto px-4 py-6 pb-20">' + content + '</div></div>';

        document.getElementById('app').innerHTML = html;
    }
}

window.app = new MoneyTracker();
    </script>
</body>
</html>
