    // ---------- TRACKING (monthly account balances) ----------
    shiftTrackingMonth(delta) { this.trackingMonth = this.shiftMonthKey(this.trackingMonth, delta); this.editingComment = false; this.render(); }
    toggleEditTrackingBalance(accId) { this.editingTrackingBalance = this.editingTrackingBalance === accId ? null : accId; this.render(); }
    accountTracksInput(accId) {
        const acc = this.accounts.find(a => a.id === accId);
        if (!acc) return false;
        if (acc.isLISA) return true;
        const cat = this.accountCategories.find(c => c.id === acc.categoryId);
        return !!(cat && cat.trackInput);
    }
    saveMonthlyBalance(accountId, mk, balanceStr, inputStr, growthStr) {
        const balance = parseFloat(balanceStr);
        if (isNaN(balance)) return;
        let entry = this.entryAt(accountId, mk);
        if (!entry) { entry = { id: this.uid(), accountId, monthKey: mk, balance }; this.monthlyBalances.push(entry); }
        else entry.balance = balance;
        if (inputStr !== undefined && inputStr !== null) entry.input = parseFloat(inputStr) || 0;
        if (growthStr !== undefined && growthStr !== null) entry.growth = parseFloat(growthStr) || 0;
        this.editingTrackingBalance = null;
        this.saveData(); this.showToast('Saved');
    }
    totalInputForAccount(accountId) {
        return this.monthlyBalances.filter(e => e.accountId === accountId).reduce((s,e) => s + (parseFloat(e.input) || 0), 0);
    }
    trackedAccountsSummaryForTaxYear(startYear) {
        const months = this.taxYearMonths(startYear);
        const monthSet = new Set(months);
        const endMk = months[months.length - 1];
        const startBaselineMk = this.shiftMonthKey(months[0], -1);
        return this.accounts.filter(a => this.accountTracksInput(a.id)).map(a => {
            const entriesInYear = this.monthlyBalances.filter(e => e.accountId === a.id && monthSet.has(e.monthKey));
            const totalInput = entriesInYear.reduce((s,e) => s + (parseFloat(e.input) || 0), 0);
            const endBalance = this.balanceAsOf(a.id, endMk);
            const startBalance = this.balanceAsOf(a.id, startBaselineMk);
            let growth;
            if (a.manualGrowth) {
                growth = entriesInYear.reduce((s,e) => s + (e.growth !== undefined ? (parseFloat(e.growth) || 0) : 0), 0);
            } else {
                growth = endBalance - startBalance - totalInput;
            }
            return { name: a.name, totalInput, growth, endBalance };
        });
    }

    // ---------- REPORTING ----------
    totalBalance() { return this.accounts.reduce((s,a) => s + this.accountBalance(a.id), 0); }
    taxYearChangeSummary(startYear) {
        const months = this.taxYearMonths(startYear);
        const endMk = months[months.length - 1];
        const startBaselineMk = this.shiftMonthKey(months[0], -1);
        let totalChange = 0, recordedCount = 0;
        this.accounts.forEach(a => {
            const hasAnyEntryInYear = this.monthlyBalances.some(e => e.accountId === a.id && months.includes(e.monthKey));
            if (!hasAnyEntryInYear) return;
            const endBalance = this.balanceAsOf(a.id, endMk);
            const startBalance = this.balanceAsOf(a.id, startBaselineMk);
            totalChange += endBalance - startBalance;
            recordedCount++;
        });
        return { totalChange, recordedCount };
    }
    biggestChangesForTaxYear(startYear) {
        const months = this.taxYearMonths(startYear);
        const endMk = months[months.length - 1];
        const startBaselineMk = this.shiftMonthKey(months[0], -1);
        const rows = [];
        this.accounts.forEach(a => {
            const hasAnyEntryInYear = this.monthlyBalances.some(e => e.accountId === a.id && months.includes(e.monthKey));
            if (!hasAnyEntryInYear) return;
            const endBalance = this.balanceAsOf(a.id, endMk);
            const startBalance = this.balanceAsOf(a.id, startBaselineMk);
            rows.push({ name: a.name, change: endBalance - startBalance });
        });
        return rows.sort((a,b) => Math.abs(b.change) - Math.abs(a.change)).slice(0,5);
    }
    isaContributionsForTaxYear(startYear) {
        const months = new Set(this.taxYearMonths(startYear));
        const isaAccounts = this.accounts.filter(a => this.isISACategoryId(a.categoryId) || a.isLISA);
        return isaAccounts.reduce((sum,a) => sum + this.monthlyBalances.filter(e => e.accountId === a.id && months.has(e.monthKey)).reduce((s2,e) => s2 + (parseFloat(e.input) || 0), 0), 0);
    }
    savingsRateForTaxYear(startYear) {
        const cs = this.taxYearChangeSummary(startYear);
        const annualIncome = this.totalIncome() * 12;
        if (annualIncome <= 0 || cs.recordedCount === 0) return null;
        return (cs.totalChange / annualIncome) * 100;
    }
    monthlyTotalBalanceSeries(startYear) {
        return this.taxYearMonths(startYear).map(mk => ({ monthKey: mk, total: this.accounts.reduce((s,a) => s + this.balanceAsOf(a.id, mk), 0) }));
    }
    allMonthKeysSorted() {
        const s = new Set(this.monthlyBalances.map(e => e.monthKey));
        return Array.from(s).sort();
    }
    balanceAsOf(accountId, mk) {
        const acc = this.accounts.find(a => a.id === accountId);
        if (!acc) return 0;
        if (acc.openingMonth && mk < acc.openingMonth) return 0;
        const entry = this.entryAt(accountId, mk);
        if (entry) return entry.balance;
        const prev = this.latestEntryBefore(accountId, mk);
        if (prev) return prev.balance;
        return parseFloat(acc.startingBalance) || 0;
    }
    toggleReportCategoryExpand(id) { this.expandedReportCategories[id] = !this.expandedReportCategories[id]; this.render(); }
    categoryMonthlyTotals(categoryId) {
        const accIds = this.accounts.filter(a => a.categoryId === categoryId).map(a => a.id);
        const months = this.allMonthKeysSorted();
        if (accIds.length === 0 || months.length === 0) return [];
        let prevTotal = null;
        return months.map(mk => {
            const total = accIds.reduce((s,id) => s + this.balanceAsOf(id, mk), 0);
            const diff = prevTotal === null ? null : total - prevTotal;
            prevTotal = total;
            return { monthKey: mk, total, diff };
        });
    }
    exportCSV() {
        let csv = 'Month,Account,Account Type,Balance\n';
        this.monthlyBalances.slice().sort((a,b) => a.monthKey.localeCompare(b.monthKey) || a.accountId.localeCompare(b.accountId)).forEach(e => {
            const acc = this.accounts.find(a => a.id === e.accountId);
            const catName = acc ? this.accountCategoryName(acc.categoryId) : '';
            const row = [e.monthKey, acc?acc.name:'', catName, e.balance];
            csv += row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',') + '\n';
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'money-tracker-export.csv'; a.click();
        URL.revokeObjectURL(url);
    }
    availableTaxYears() {
        const years = new Set(this.allMonthKeysSorted().map(mk => this.taxYearStartForMonthKey(mk)));
        years.add(this.reportingTaxYear);
        return Array.from(years).sort((a,b) => b - a);
    }
    toggleAllPDFCheckboxes(className, checked) {
        document.querySelectorAll('.' + className).forEach(el => { el.checked = checked; });
    }
    generatePDFReport() {
        const yearSel = document.getElementById('pdf_year').value;
        const selectedMonthNums = Array.from(document.querySelectorAll('.pdf-month-checkbox:checked')).map(el => el.dataset.month);
        const selectedAccountIds = Array.from(document.querySelectorAll('.pdf-account-checkbox:checked')).map(el => el.dataset.accountId);
        if (selectedMonthNums.length === 0 || selectedAccountIds.length === 0) { alert('Please select at least one month and one account.'); return; }

        let months;
        if (yearSel === 'all') {
            months = this.allMonthKeysSorted().filter(mk => selectedMonthNums.includes(mk.split('-')[1]));
            if (months.length === 0) months = [this.currentMonthKey()];
        } else {
            months = this.taxYearMonths(parseInt(yearSel)).filter(mk => selectedMonthNums.includes(mk.split('-')[1]));
        }
        const accounts = this.accounts.filter(a => selectedAccountIds.includes(a.id));
        const periodLabel = yearSel === 'all' ? 'All Years' : 'Tax Year ' + this.taxYearLabel(parseInt(yearSel));

        let rows = '';
        months.forEach(mk => {
            let rowTotal = 0;
            let cells = accounts.map(a => { const v = this.balanceAsOf(a.id, mk); rowTotal += v; return '<td>' + this.fmt(v) + '</td>'; }).join('');
            rows += '<tr><td>' + this.monthLabel(mk) + '</td>' + cells + '<td><strong>' + this.fmt(rowTotal) + '</strong></td></tr>';
        });
        const openingTotal = accounts.reduce((s,a) => s + this.balanceAsOf(a.id, this.shiftMonthKey(months[0], -1)), 0);
        const closingTotal = accounts.reduce((s,a) => s + this.balanceAsOf(a.id, months[months.length-1]), 0);
        const netChange = closingTotal - openingTotal;

        const reportHtml = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Money Tracker Report</title><style>' +
            'body{font-family:Arial,Helvetica,sans-serif;color:#2D3436;padding:24px;} h1{font-size:20px;margin-bottom:4px;} p.meta{color:#636E72;font-size:12px;margin-top:0;} ' +
            'table{width:100%;border-collapse:collapse;margin-top:16px;font-size:12px;} th,td{border:1px solid #DFE6E9;padding:6px 8px;text-align:right;} th:first-child,td:first-child{text-align:left;} th{background:#F0F7F4;} ' +
            '.summary{margin-top:16px;font-size:13px;} .summary p{margin:4px 0;} @media print{body{padding:0;}}' +
            '</style></head><body>' +
            '<h1>Money Tracker Report</h1>' +
            '<p class="meta">Generated ' + new Date().toLocaleString('en-GB') + ' · Period: ' + periodLabel + '</p>' +
            '<div class="summary"><p><strong>Opening total:</strong> ' + this.fmt(openingTotal) + '</p><p><strong>Closing total:</strong> ' + this.fmt(closingTotal) + '</p><p><strong>Net change:</strong> ' + this.fmtSigned(netChange) + '</p></div>' +
            '<table><thead><tr><th>Month</th>' + accounts.map(a => '<th>' + a.name + '</th>').join('') + '<th>Total</th></tr></thead><tbody>' + rows + '</tbody></table>' +
            '</body></html>';

        const w = window.open('', '_blank');
        if (!w) { alert('Please allow pop-ups to generate the PDF report.'); return; }
        w.document.write(reportHtml);
        w.document.close();
        setTimeout(() => { w.print(); }, 300);
    }
    renderPDFReportSettings() {
        const years = this.availableTaxYears();
        let html = '<div class="p-3 rounded-lg border mb-2" style="background-color: var(--color-bg); border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Year</p>';
        html += '<select id="pdf_year" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);"><option value="all">All Years</option>' + years.map(y => '<option value="' + y + '">Tax Year ' + this.taxYearLabel(y) + '</option>').join('') + '</select>';

        html += '<div class="flex items-center justify-between mb-1"><p class="text-xs" style="color: var(--color-text-muted);">Months</p><button onclick="window.app.toggleAllPDFCheckboxes(\'pdf-month-checkbox\', true)" class="text-xs underline" style="color: var(--color-accent);">Select all</button></div>';
        html += '<div class="grid grid-cols-3 gap-1 mb-3">';
        const monthNames = ['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar'];
        const monthNums = ['04','05','06','07','08','09','10','11','12','01','02','03'];
        monthNums.forEach((mn,idx) => {
            html += '<label class="flex items-center gap-1 text-xs" style="color: var(--color-text);"><input type="checkbox" class="pdf-month-checkbox" data-month="' + mn + '" checked> ' + monthNames[idx] + '</label>';
        });
        html += '</div>';

        html += '<div class="flex items-center justify-between mb-1"><p class="text-xs" style="color: var(--color-text-muted);">Accounts</p><button onclick="window.app.toggleAllPDFCheckboxes(\'pdf-account-checkbox\', true)" class="text-xs underline" style="color: var(--color-accent);">Select all</button></div>';
        if (this.accounts.length === 0) html += '<p class="text-xs mb-3" style="color: var(--color-text-muted);">No accounts yet.</p>';
        this.accounts.forEach(a => {
            html += '<label class="flex items-center gap-2 text-xs mb-1" style="color: var(--color-text);"><input type="checkbox" class="pdf-account-checkbox" data-account-id="' + a.id + '" checked> ' + a.name + '</label>';
        });
        html += '<button onclick="window.app.generatePDFReport()" class="w-full py-2 rounded text-white mt-3" style="background-color: var(--color-primary);">Generate PDF Report</button>';
        html += '</div>';
        return html;
    }

    // ---------- RENDER: PLANNING ----------
    renderBudgetRow(c, isLast) {
        const b = this.getBudget(c.id);
        const isEditing = this.editingBudget === c.id || !b;
        const borderStyle = isLast ? '' : ' border-b';
        let html = '<div class="p-4' + borderStyle + '" style="border-color: var(--color-border);">';
        html += '<div class="flex items-center justify-between" style="color: var(--color-text);"><span class="font-medium">' + c.name + '</span>';
        if (c.percentageBased) {
            const pct = b ? (parseFloat(b.percentage) || 0) : 0;
            const amount = this.totalIncome() * (pct / 100);
            if (isEditing) {
                html += '<div class="flex items-center gap-2"><input id="bg_' + c.id + '" type="number" step="0.1" value="' + pct + '" class="w-16 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"><span class="text-xs" style="color: var(--color-text-muted);">%</span><button onclick="window.app.setBudgetPercentage(\'' + c.id + '\', document.getElementById(\'bg_' + c.id + '\').value)" class="text-xs font-semibold px-3 py-1.5 rounded-lg text-white" style="background-color: var(--color-primary);">Save</button></div></div>';
            } else {
                html += '<div class="flex items-center gap-3"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(amount) + '</span><span class="text-xs" style="color: var(--color-text-muted);">(' + pct + '%)</span><button onclick="window.app.toggleEditBudget(\'' + c.id + '\')" class="text-xs font-semibold underline" style="color: var(--color-accent);">Edit</button></div></div>';
            }
        } else if (c.splitFurther) {
            const subItems = this.getSubItems(c.id);
            const total = this.subItemsTotal(c.id);
            html += '<span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(total) + '</span></div>';
            subItems.forEach(item => {
                html += '<div class="flex items-center gap-2 mt-2"><input value="' + (item.name||'') + '" placeholder="Item name" onchange="window.app.updateSubItemField(\'' + c.id + '\', \'' + item.id + '\', \'name\', this.value)" class="flex-1 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"><input type="number" step="0.01" value="' + item.amount + '" placeholder="£" onchange="window.app.updateSubItemField(\'' + c.id + '\', \'' + item.id + '\', \'amount\', this.value)" class="w-20 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"><button onclick="window.app.deleteSubItem(\'' + c.id + '\', \'' + item.id + '\')" class="text-xs px-2 py-1.5 rounded-lg" style="background-color: var(--color-error); color: white;">×</button></div>';
            });
            html += '<button onclick="window.app.addSubItem(\'' + c.id + '\')" class="text-xs font-semibold underline mt-2" style="color: var(--color-accent);">+ Add item</button>';
        } else {
            const target = b ? b.monthlyAmount : 0;
            if (isEditing) {
                html += '<div class="flex items-center gap-2"><span class="text-xs" style="color: var(--color-text-muted);">£</span><input id="bg_' + c.id + '" type="number" step="0.01" value="' + target + '" class="w-20 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"><button onclick="window.app.setBudget(\'' + c.id + '\', document.getElementById(\'bg_' + c.id + '\').value)" class="text-xs font-semibold px-3 py-1.5 rounded-lg text-white" style="background-color: var(--color-primary);">Save</button></div></div>';
            } else {
                html += '<div class="flex items-center gap-3"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(target) + '</span><button onclick="window.app.toggleEditBudget(\'' + c.id + '\')" class="text-xs font-semibold underline" style="color: var(--color-accent);">Edit</button></div></div>';
            }
        }
        html += '</div>';
        return html;
    }
    toggleGroupExpand(key) { this.expandedGroups[key] = !this.expandedGroups[key]; this.render(); }
    groupBudgetTotal(key) {
        return this.categories.filter(c => this.categoryGroup(c) === key)
            .reduce((sum, c) => {
                if (c.splitFurther) return sum + this.subItemsTotal(c.id);
                const b = this.getBudget(c.id);
                if (!b) return sum;
                if (c.percentageBased) return sum + this.totalIncome() * ((parseFloat(b.percentage) || 0) / 100);
                return sum + (parseFloat(b.monthlyAmount) || 0);
            }, 0);
    }
    colorForTargetDistance(distance) {
        // Green when within 2 points of target, grading toward red the further away.
        const green = [0,184,148], red = [255,71,87];
        const cap = 15;
        const t = distance <= 2 ? 0 : Math.min(1, (distance - 2) / (cap - 2));
        const rgb = [0,1,2].map(i => Math.round(green[i] + (red[i]-green[i]) * t));
        return 'rgb(' + rgb.join(',') + ')';
    }
    totalAllocatedPercent() {
        if (this.totalIncome() <= 0) return null;
        const total = ['essential','saving','spending'].reduce((s,key) => s + this.groupBudgetTotal(key), 0);
        return (total / this.totalIncome()) * 100;
    }
    renderPlanningTab() {
        const totalIncome = this.totalIncome();
        let html = this.renderTasksSection();
        html += '<p class="text-sm mb-4 mt-5" style="color: var(--color-text-muted);">Check your amounts for each category then hit Save.</p>';
        if (totalIncome === 0) html += '<p class="text-sm mb-4 p-3 rounded-xl" style="background-color: var(--color-secondary); color: var(--color-text);">Set your salary in ⚙️ Settings → Income to see each section&#8217;s share of income.</p>';

        const totalPct = this.totalAllocatedPercent();
        if (totalPct !== null) {
            const overBudget = totalPct > 100;
            const gradientStyle = overBudget ? 'background: linear-gradient(135deg, #FF6B6B 0%, #FF3D57 100%);' : 'background: linear-gradient(135deg, #00B894 0%, #00D8A8 100%);';
            html += '<div class="p-5 rounded-3xl shadow-sm mb-5" style="' + gradientStyle + '">';
            html += '<div class="flex items-center justify-between mb-2"><span class="text-xs font-bold uppercase tracking-wide" style="color: rgba(255,255,255,0.85);">Total Allocated</span><span class="text-4xl font-extrabold text-white">' + totalPct.toFixed(1) + '%</span></div>';
            html += '<div class="w-full rounded-full h-3" style="background-color: rgba(255,255,255,0.3);"><div class="h-3 rounded-full" style="width: ' + Math.min(100, totalPct) + '%; background-color: white; transition: width 0.3s;"></div></div>';
            if (overBudget) {
                html += '<div class="flex items-center gap-2 mt-3 p-2 rounded-lg" style="background-color: rgba(255,255,255,0.2);"><span>⚠️</span><span class="text-xs font-medium text-white">You have allocated ' + (totalPct - 100).toFixed(1) + '% more than your income covers.</span></div>';
            }
            html += '</div>';
        }

        const groupMeta = {
            essential: { label: 'Essentials', icon: '🏠', accent: 'var(--color-essential)', accentBg: 'var(--color-essential-bg)' },
            saving: { label: 'Saving', icon: '💰', accent: 'var(--color-saving)', accentBg: 'var(--color-saving-bg)' },
            spending: { label: 'Spending', icon: '🛍️', accent: 'var(--color-spending)', accentBg: 'var(--color-spending-bg)' }
        };
        const groups = ['essential','saving','spending'];
        groups.forEach(key => {
            const cats = this.categories.filter(c => this.categoryGroup(c) === key);
            if (cats.length === 0) return;
            const meta = groupMeta[key];
            const groupTotal = this.groupBudgetTotal(key);
            const pct = totalIncome > 0 ? (groupTotal / totalIncome) * 100 : null;
            const target = parseFloat(this.groupTargets[key]) || 0;
            const expanded = !!this.expandedGroups[key];

            let statusColor = 'var(--color-text-muted)';
            let targetText = '';
            if (pct !== null && target > 0) {
                const distance = Math.abs(pct - target);
                statusColor = this.colorForTargetDistance(distance);
                targetText = 'target ' + target + '%' + (distance <= 2 ? ' ✓' : '');
            }

            html += '<div class="rounded-2xl shadow-sm mb-3 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
            html += '<button onclick="window.app.toggleGroupExpand(\'' + key + '\')" class="w-full flex items-center justify-between p-4">';
            html += '<div class="flex items-center gap-3"><span class="text-xs" style="color: var(--color-text-muted);">' + (expanded ? '▾' : '▸') + '</span><span class="flex items-center justify-center rounded-full" style="width: 36px; height: 36px; background-color: ' + meta.accentBg + '; font-size: 16px;">' + meta.icon + '</span><span class="text-base font-bold" style="color: var(--color-text);">' + meta.label + '</span></div>';
            html += '<div class="text-right">' + (pct !== null ? '<div class="text-lg font-bold" style="color: ' + statusColor + ';">' + pct.toFixed(1) + '%</div>' + (targetText ? '<div class="text-xs" style="color: var(--color-text-muted);">' + targetText + '</div>' : '') : '<div class="text-lg font-bold" style="color: var(--color-text);">' + this.fmt(groupTotal) + '</div>') + '</div>';
            html += '</button>';
            if (expanded) {
                html += '<div class="expand-content" style="border-top: 1px solid var(--color-border);">';
                cats.forEach((c,idx) => { html += this.renderBudgetRow(c, idx === cats.length - 1); });
                html += '</div>';
            }
            html += '</div>';
        });

        if (this.categories.length === 0) html += '<p style="color: var(--color-text-muted);">No planning categories yet. Add one below.</p>';

        html += '<div class="rounded-2xl shadow-sm mt-4 p-3" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        if (this.addingCategory) {
            html += this.renderCategoryForm(null);
        } else {
            html += '<div class="flex items-center justify-between flex-wrap gap-2">';
            html += '<button onclick="window.app.toggleAddCategory()" class="text-sm font-semibold underline" style="color: var(--color-accent);">+ Add Planning Category</button>';
            html += '<button onclick="window.app.toggleEditGroupTargetsInline()" class="text-sm font-semibold underline" style="color: var(--color-accent);">Edit targets</button>';
            html += '</div>';
        }
        if (this.editingGroupTargetsInline) {
            html += '<div class="mt-3 pt-3" style="border-top: 1px solid var(--color-border);">';
            html += '<p class="text-xs font-semibold mb-2" style="color: var(--color-text);">Essentials / Saving / Spending Targets</p>';
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Essential %</p><input id="pt_gt_essential" type="number" step="1" value="' + this.groupTargets.essential + '" class="w-full px-3 py-2 rounded-lg border mb-2" style="border-color: var(--color-border);">';
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Saving %</p><input id="pt_gt_saving" type="number" step="1" value="' + this.groupTargets.saving + '" class="w-full px-3 py-2 rounded-lg border mb-2" style="border-color: var(--color-border);">';
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Spending %</p><input id="pt_gt_spending" type="number" step="1" value="' + this.groupTargets.spending + '" class="w-full px-3 py-2 rounded-lg border mb-3" style="border-color: var(--color-border);">';
            html += '<div class="flex gap-2"><button onclick="window.app.saveGroupTargetsInline()" class="flex-1 py-2 rounded-lg text-white text-sm font-semibold" style="background-color: var(--color-primary);">Save</button><button onclick="window.app.toggleEditGroupTargetsInline()" class="flex-1 py-2 rounded-lg text-sm font-semibold" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div>';
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    // ---------- RENDER: TASKS ----------
    renderTasksSection() {
        const mk = this.currentMonthKey();
        const expanded = !!this.expandedGroups.tasks;
        let html = '<div class="rounded-2xl shadow-sm overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        html += '<button onclick="window.app.toggleGroupExpand(\'tasks\')" class="w-full flex items-center justify-between p-4">';
        html += '<div class="flex items-center gap-3"><span class="text-xs" style="color: var(--color-text-muted);">' + (expanded ? '▾' : '▸') + '</span><span class="flex items-center justify-center rounded-full" style="width: 36px; height: 36px; background-color: var(--color-tasks-bg); font-size: 16px;">📋</span><span class="text-base font-bold" style="color: var(--color-text);">Monthly Tasks</span></div>';
        html += '<span onclick="event.stopPropagation(); window.app.resetMonthlyTasks()" class="text-xs font-semibold px-3 py-1.5 rounded-lg" style="background-color: var(--color-secondary); color: var(--color-text);">↻ Reset</span>';
        html += '</button>';
        if (expanded) {
            html += '<div class="expand-content" style="border-top: 1px solid var(--color-border);">';
            if (this.tasks.length === 0) {
                html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No monthly tasks yet. Add some in ⚙️ Settings → Monthly Tasks.</p>';
            }
            this.tasks.forEach((t,idx) => {
                const paid = !!(t.paidMonths && t.paidMonths[mk]);
                const linkedCount = (t.linkedCategoryIds || []).length;
                let amountBadge = '';
                if (this.linkTasksToPlanning && linkedCount > 0) {
                    amountBadge = '<span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(this.linkedCategoriesTotal(t)) + '</span>';
                }
                const borderStyle = idx === this.tasks.length - 1 ? '' : ' border-b';
                html += '<label class="flex items-center gap-3 p-4' + borderStyle + '" style="border-color: var(--color-border); cursor: pointer;">';
                html += '<input type="checkbox" ' + (paid?'checked':'') + ' onchange="window.app.toggleTaskPaid(\'' + t.id + '\')" class="w-5 h-5 flex-shrink-0">';
                html += '<p class="flex-1" style="color: var(--color-text); ' + (paid?'text-decoration: line-through; opacity: 0.6;':'') + '">' + t.text + '</p>';
                html += amountBadge;
                html += '</label>';
            });
            html += '</div>';
        }
        html += '</div>';
        return html;
    }
    renderTaskForm(t) {
        const isEdit = !!t;
        const currentIdx = isEdit ? this.tasks.findIndex(x => x.id === t.id) : -1;
        const optionCount = isEdit ? this.tasks.length : this.tasks.length + 1;
        const defaultPos = isEdit ? currentIdx + 1 : optionCount;
        let html = '<div class="p-4 rounded-lg border mb-3" style="background-color: var(--color-surface); border-color: var(--color-border);">';
        html += '<input id="tk_text" placeholder="Task (e.g. Enter salary, Adjust monthly figures)" value="' + (t?t.text:'') + '" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">';
        html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Order</p>';
        let opts = '';
        for (let i = 1; i <= optionCount; i++) { opts += '<option value="' + i + '"' + (i===defaultPos?' selected':'') + '>' + i + '</option>'; }
        html += '<select id="tk_order" class="w-full px-3 py-2 rounded border mb-3" style="border-color: var(--color-border);">' + opts + '</select>';
        if (this.linkTasksToPlanning) {
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Linked planning categories</p>';
            if (this.taskFormLinkedCategories.length === 0) html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">None linked yet.</p>';
            this.taskFormLinkedCategories.forEach(catId => {
                const cat = this.categories.find(x => x.id === catId);
                html += '<div class="flex items-center justify-between p-2 mb-1 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><span class="text-sm" style="color: var(--color-text);">' + (cat ? cat.name : 'Unknown') + '</span><button onclick="window.app.removeLinkedCategoryFromTaskForm(\'' + catId + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-error); color: white;">×</button></div>';
            });
            const available = this.categories.filter(c => !this.taskFormLinkedCategories.includes(c.id));
            if (available.length > 0) {
                html += '<div class="flex items-center gap-2 mt-2 mb-3"><select id="tk_link_select" class="flex-1 px-2 py-2 rounded border text-sm" style="border-color: var(--color-border);">' + available.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('') + '</select><button onclick="window.app.addLinkedCategoryToTaskForm(document.getElementById(\'tk_link_select\').value)" class="text-xs px-3 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add</button></div>';
            }
        }
        html += '<div class="flex gap-2"><button onclick="window.app.saveTask(' + (isEdit?"'"+t.id+"'":'null') + ', document.getElementById(\'tk_text\').value, document.getElementById(\'tk_order\').value)" class="flex-1 py-2 rounded text-white" style="background-color: var(--color-primary);">Save</button>';
        html += '<button onclick="window.app.' + (isEdit?'toggleEditTask(\''+t.id+'\')':'toggleAddTask()') + '" class="flex-1 py-2 rounded" style="background-color: var(--color-secondary); color: var(--color-text);">Cancel</button></div></div>';
        return html;
    }

    // ---------- RENDER: TRACKING ----------
    accountCategoryColor(categoryId) {
        const palette = ['#0984E3','#6C5CE7','#00B894','#E17055','#D63031','#00CEC9','#FDCB6E','#E84393','#2D3436','#0FB9B1'];
        const idx = this.accountCategories.findIndex(c => c.id === categoryId);
        if (idx === -1) return '#636E72';
        return palette[idx % palette.length];
    }
    toggleTrackingCategoryExpand(id) { this.expandedTrackingCategories[id] = !this.expandedTrackingCategories[id]; this.render(); }
    renderTrackingAccountRow(a, mk, color, isLast) {
        const borderStyle = isLast ? '' : ' border-b';
        if (a.openingMonth && mk < a.openingMonth) {
            return '<div class="p-4' + borderStyle + '" style="border-color: var(--color-border);"><span class="font-medium" style="color: var(--color-text);">' + a.name + '</span><p class="text-xs mt-1" style="color: var(--color-text-muted);">Starts ' + this.monthLabel(a.openingMonth) + '</p></div>';
        }
        if (a.closed && a.closedMonth && mk > a.closedMonth) {
            return '<div class="p-4' + borderStyle + '" style="border-color: var(--color-border);"><span class="font-medium" style="color: var(--color-text);">' + a.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(Closed)</span><p class="text-xs mt-1" style="color: var(--color-text-muted);">Closed ' + this.monthLabel(a.closedMonth) + ' · ' + this.fmt(this.balanceAsOf(a.id, mk)) + '</p></div>';
        }
        const entry = this.entryAt(a.id, mk);
        const prev = this.latestEntryBefore(a.id, mk);
        const baseline = prev ? prev.balance : (parseFloat(a.startingBalance) || 0);
        const diff = entry ? entry.balance - baseline : null;
        const tracksInput = this.accountTracksInput(a.id);
        const manualGrowth = tracksInput && !!a.manualGrowth;
        const isEditing = this.editingTrackingBalance === a.id || !entry;
        let html = '<div class="p-4' + borderStyle + '" style="border-color: var(--color-border);">';
        html += '<div class="flex items-center justify-between mb-2"><div><span class="font-medium" style="color: var(--color-text);">' + a.name + '</span>' + (a.isaType ? ' <span class="text-xs" style="color: var(--color-text-muted);">(' + this.isaTypeLabel(a.isaType) + ')</span>' : '') + (a.isLISA ? ' <span class="text-xs" style="color: var(--color-text-muted);">(LISA)</span>' : '') + (a.closed ? ' <span class="text-xs" style="color: var(--color-text-muted);">(Closed)</span>' : '') + '</div></div>';
        if (isEditing) {
            html += '<div class="flex items-center gap-2 mb-2"><span class="text-xs" style="color: var(--color-text-muted); width: 90px;">Balance £</span><input id="tb_' + a.id + '" type="number" step="0.01" value="' + (entry ? entry.balance : '') + '" placeholder="' + this.fmt(baseline) + '" class="flex-1 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"></div>';
            if (tracksInput) {
                html += '<div class="flex items-center gap-2 mb-2"><span class="text-xs" style="color: var(--color-text-muted); width: 90px;">Put in £</span><input id="ti_' + a.id + '" type="number" step="0.01" value="' + (entry && entry.input !== undefined ? entry.input : '') + '" placeholder="0.00" class="flex-1 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"></div>';
            }
            if (manualGrowth) {
                html += '<div class="flex items-center gap-2 mb-2"><span class="text-xs" style="color: var(--color-text-muted); width: 90px;">Growth £</span><input id="tg_' + a.id + '" type="number" step="0.01" value="' + (entry && entry.growth !== undefined ? entry.growth : '') + '" placeholder="0.00" class="flex-1 px-2 py-1.5 rounded-lg border text-sm" style="border-color: var(--color-border);"></div>';
            }
            html += '<button onclick="window.app.saveMonthlyBalance(\'' + a.id + '\', \'' + mk + '\', document.getElementById(\'tb_' + a.id + '\').value' + (tracksInput ? ", document.getElementById('ti_" + a.id + "').value" : ', null') + (manualGrowth ? ", document.getElementById('tg_" + a.id + "').value" : '') + ')" class="text-xs font-semibold px-3 py-2 rounded-lg text-white w-full" style="background-color: ' + color + ';">Save</button>';
        } else {
            html += '<div class="flex items-center justify-between mb-1"><span class="text-xs" style="color: var(--color-text-muted);">Balance</span><div class="flex items-center gap-3"><span class="text-sm font-bold" style="color: var(--color-text);">' + this.fmt(entry.balance) + '</span><button onclick="window.app.toggleEditTrackingBalance(\'' + a.id + '\')" class="text-xs font-semibold underline" style="color: var(--color-accent);">Edit</button></div></div>';
            if (tracksInput) {
                html += '<div class="flex items-center justify-between"><span class="text-xs" style="color: var(--color-text-muted);">Put in</span><span class="text-sm" style="color: var(--color-text);">' + this.fmt(entry.input !== undefined ? entry.input : 0) + '</span></div>';
            }
            if (manualGrowth) {
                html += '<div class="flex items-center justify-between"><span class="text-xs" style="color: var(--color-text-muted);">Growth</span><span class="text-sm" style="color: var(--color-text);">' + this.fmt(entry.growth !== undefined ? entry.growth : 0) + '</span></div>';
            }
        }
        if (diff !== null) {
            if (tracksInput) {
                const monthInput = (entry.input !== undefined) ? (parseFloat(entry.input) || 0) : 0;
                const growth = manualGrowth && entry.growth !== undefined ? (parseFloat(entry.growth) || 0) : (diff - monthInput);
                const growthNote = manualGrowth && entry.growth !== undefined ? ' (manual)' : '';
                html += '<p class="text-xs mt-2" style="color: ' + (diff >= 0 ? 'var(--color-success)' : 'var(--color-error)') + ';">' + this.fmtSigned(diff) + ' vs ' + (prev ? this.monthLabel(prev.monthKey) : 'opening balance') + ' — ' + this.fmt(monthInput) + ' put in, ' + this.fmtSigned(growth) + ' growth' + growthNote + '</p>';
            } else {
                html += '<p class="text-xs mt-2" style="color: ' + (diff >= 0 ? 'var(--color-success)' : 'var(--color-error)') + ';">' + this.fmtSigned(diff) + ' vs ' + (prev ? this.monthLabel(prev.monthKey) : 'opening balance') + '</p>';
            }
        }
        html += '</div>';
        return html;
    }
    groupMonthDiff(accounts, mk) {
        const prevMk = this.shiftMonthKey(mk, -1);
        let total = 0, baseline = 0, anyEntry = false;
        accounts.forEach(a => {
            if (a.openingMonth && mk < a.openingMonth) return;
            if (this.entryAt(a.id, mk)) anyEntry = true;
            total += this.balanceAsOf(a.id, mk);
            baseline += this.balanceAsOf(a.id, prevMk);
        });
        return anyEntry ? (total - baseline) : null;
    }
    // ---------- MONTHLY REVIEW ----------
    shiftReviewMonth(delta) { this.reviewMonth = this.shiftMonthKey(this.reviewMonth, delta); this.render(); }
    saveMonthlyComment(mk, text) { this.monthlyComments[mk] = text; this.editingComment = false; this.saveData(); this.showToast('Comment saved'); }
    toggleEditComment() { this.editingComment = !this.editingComment; this.render(); }
    toggleCommentsEnabled(checked) { this.commentsEnabled = checked; this.saveData(); this.showToast('Saved'); }
    renderTrackingCommentSection(mk) {
        if (!this.commentsEnabled) return '';
        const comment = this.monthlyComments[mk] || '';
        const isEditing = this.editingComment || !comment;
        let html = '<div class="rounded-2xl shadow-sm mb-4 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        html += '<div class="flex items-center gap-2 p-4 pb-2"><span>📝</span><span class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">End of month comment - how did it go?</span></div>';
        html += '<div class="px-4 pb-4">';
        if (isEditing) {
            html += '<textarea id="tracking_comment_' + mk + '" placeholder="How did this month go?" class="w-full px-3 py-2 rounded-lg border text-sm" style="border-color: var(--color-border); min-height: 80px;">' + comment + '</textarea>';
            html += '<button onclick="window.app.saveMonthlyComment(\'' + mk + '\', document.getElementById(\'tracking_comment_' + mk + '\').value)" class="w-full mt-2 py-2 rounded-lg text-white text-sm font-semibold" style="background-color: var(--color-primary);">Save</button>';
        } else {
            html += '<p class="text-sm mb-2" style="color: var(--color-text);">' + comment + '</p>';
            html += '<button onclick="window.app.toggleEditComment()" class="text-xs font-semibold underline" style="color: var(--color-accent);">Edit</button>';
        }
        html += '</div></div>';
        return html;
    }
    monthTotalAndDiff(accounts, mk) {
        const prevMk = this.shiftMonthKey(mk, -1);
        const total = accounts.reduce((s,a) => s + this.balanceAsOf(a.id, mk), 0);
        const prevTotal = accounts.reduce((s,a) => s + this.balanceAsOf(a.id, prevMk), 0);
        return { total, diff: total - prevTotal };
    }
    changeArrow(diff) {
        if (diff === 0) return '';
        const up = diff >= 0;
        return ' <span style="color: ' + (up ? 'var(--color-success)' : 'var(--color-error)') + ';">' + (up ? '▲' : '▼') + '</span>';
    }
    // ---------- RENDER: HOME ----------
    renderHomeTab() {
        if (!this.setupGuideCompleted) return this.renderStartHereTab();
        const mk = this.currentMonthKey();
        let html = '<p class="text-sm mb-4" style="color: var(--color-text-muted);">' + this.monthLabel(mk) + '</p>';

        if (this.accounts.length === 0) {
            html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No accounts yet. Add some from the Tracking tab.</p>';
            return html;
        }

        const overall = this.monthTotalAndDiff(this.accounts, mk);
        html += '<div class="p-5 rounded-3xl shadow-sm mb-4 hero-gradient">';
        html += '<div class="flex items-center gap-2 mb-1"><span>💷</span><span class="text-xs font-bold uppercase tracking-wide" style="color: rgba(255,255,255,0.85);">Overall Wealth</span></div>';
        html += '<p class="text-4xl font-extrabold text-white">' + this.fmt(overall.total) + '</p>';
        html += '<p class="text-sm mt-1 font-medium" style="color: white;">' + this.fmtSigned(overall.diff) + this.changeArrow(overall.diff) + ' vs ' + this.monthLabel(this.shiftMonthKey(mk,-1)) + '</p>';
        html += '</div>';

        const groups = [];
        this.accountCategories.forEach(cat => {
            const accs = this.accounts.filter(a => a.categoryId === cat.id);
            if (accs.length) groups.push({ name: cat.name, color: this.accountCategoryColor(cat.id), accounts: accs });
        });
        const uncategorised = this.accounts.filter(a => !this.accountCategories.some(c => c.id === a.categoryId));
        if (uncategorised.length) groups.push({ name: 'Uncategorised', color: this.accountCategoryColor(''), accounts: uncategorised });

        html += '<div class="rounded-2xl shadow-sm overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-2 p-4 pb-2"><span>📊</span><span class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">By Category</span></div>';
        groups.forEach((g,idx) => {
            const gd = this.monthTotalAndDiff(g.accounts, mk);
            html += '<div class="flex items-center justify-between p-4 pt-2' + (idx < groups.length-1?' border-b':'') + '" style="border-color: var(--color-border);">';
            html += '<div class="flex items-center gap-3"><span class="flex items-center justify-center rounded-full" style="width: 32px; height: 32px; background-color: ' + g.color + '; color: white; font-weight: 700; font-size: 13px;">' + g.name.charAt(0).toUpperCase() + '</span><span style="color: var(--color-text);">' + g.name + '</span></div>';
            html += '<div class="text-right"><p class="font-bold" style="color: var(--color-text);">' + this.fmt(gd.total) + '</p><p class="text-xs" style="color: ' + (gd.diff>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(gd.diff) + this.changeArrow(gd.diff) + '</p></div>';
            html += '</div>';
        });
        html += '</div>';
        return html;
    }
    renderMonthlyReviewSection() {
        const mk = this.reviewMonth;
        let html = '<div class="flex items-center justify-between mb-3">';
        html += '<button onclick="window.app.shiftReviewMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">‹</button>';
        html += '<p class="font-bold" style="color: var(--color-text);">Monthly Review — ' + this.monthLabel(mk) + '</p>';
        html += '<button onclick="window.app.shiftReviewMonth(1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">›</button>';
        html += '</div>';

        if (this.accounts.length === 0) {
            html += '<p class="text-center py-6" style="color: var(--color-text-muted);">No accounts yet.</p>';
            return html;
        }

        const overall = this.monthTotalAndDiff(this.accounts, mk);
        html += '<div class="p-5 rounded-3xl shadow-sm mb-4 hero-gradient">';
        html += '<div class="flex items-center gap-2 mb-1"><span>💷</span><span class="text-xs font-bold uppercase tracking-wide" style="color: rgba(255,255,255,0.85);">Overall Wealth</span></div>';
        html += '<p class="text-4xl font-extrabold text-white">' + this.fmt(overall.total) + '</p>';
        html += '<p class="text-sm mt-1 font-medium" style="color: white;">' + this.fmtSigned(overall.diff) + this.changeArrow(overall.diff) + ' vs ' + this.monthLabel(this.shiftMonthKey(mk,-1)) + '</p>';
        html += '</div>';

        const groups = [];
        this.accountCategories.forEach(cat => {
            const accs = this.accounts.filter(a => a.categoryId === cat.id);
            if (accs.length) groups.push({ name: cat.name, accounts: accs });
        });
        const uncategorised = this.accounts.filter(a => !this.accountCategories.some(c => c.id === a.categoryId));
        if (uncategorised.length) groups.push({ name: 'Uncategorised', accounts: uncategorised });

        html += '<div class="rounded-2xl shadow-sm mb-4 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-2 p-4 pb-2"><span>📊</span><span class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">By Category</span></div>';
        groups.forEach((g,idx) => {
            const gd = this.monthTotalAndDiff(g.accounts, mk);
            html += '<div class="flex items-center justify-between p-4 pt-2' + (idx < groups.length-1?' border-b':'') + '" style="border-color: var(--color-border);">';
            html += '<span style="color: var(--color-text);">' + g.name + '</span>';
            html += '<div class="text-right"><p class="font-bold" style="color: var(--color-text);">' + this.fmt(gd.total) + '</p><p class="text-xs" style="color: ' + (gd.diff>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(gd.diff) + this.changeArrow(gd.diff) + '</p></div>';
            html += '</div>';
        });
        html += '</div>';

        return html;
    }
    renderTrackingTab() {
        const mk = this.trackingMonth;
        let html = '';
        if (this.accounts.length > 0) {
            const netWorth = this.monthTotalAndDiff(this.accounts, mk);
            html += '<div class="p-5 rounded-3xl shadow-sm mb-4 hero-gradient">';
            html += '<div class="flex items-center gap-2 mb-1"><span>💷</span><span class="text-xs font-bold uppercase tracking-wide" style="color: rgba(255,255,255,0.85);">Net Worth</span></div>';
            html += '<p class="text-4xl font-extrabold text-white">' + this.fmt(netWorth.total) + '</p>';
            html += '<p class="text-sm mt-1 font-medium" style="color: white;">' + this.fmtSigned(netWorth.diff) + this.changeArrow(netWorth.diff) + ' vs ' + this.monthLabel(this.shiftMonthKey(mk,-1)) + '</p>';
            html += '</div>';
        }
        html += '<div class="flex items-center justify-between mb-4 gap-1">';
        html += '<button onclick="window.app.shiftTrackingMonth(-12)" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: var(--color-secondary); color: var(--color-text); font-size: 12px;">«</button>';
        html += '<button onclick="window.app.shiftTrackingMonth(-1)" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: var(--color-secondary); color: var(--color-text);">‹</button>';
        html += '<p class="font-bold flex-1 text-center" style="color: var(--color-text);">' + this.monthLabel(mk) + '</p>';
        html += '<button onclick="window.app.shiftTrackingMonth(1)" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: var(--color-secondary); color: var(--color-text);">›</button>';
        html += '<button onclick="window.app.shiftTrackingMonth(12)" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="background-color: var(--color-secondary); color: var(--color-text); font-size: 12px;">»</button>';
        html += '</div>';

        if (this.accounts.some(a => a.linkedCategoryId)) {
            html += '<button onclick="window.app.copyPlanningAmountsToTracking()" class="w-full text-xs font-semibold px-3 py-2 rounded-lg mb-4" style="background-color: var(--color-secondary); color: var(--color-text);">📋➡️🏦 Copy over amounts</button>';
        }

        if (this.accounts.length === 0) {
            html += '<p class="text-center py-8" style="color: var(--color-text-muted);">No accounts yet. Add one below.</p>';
        } else {
            const groups = [];
            this.accountCategories.forEach(cat => {
                const accs = this.accounts.filter(a => a.categoryId === cat.id);
                if (accs.length) groups.push({ id: cat.id, name: cat.name, color: this.accountCategoryColor(cat.id), accounts: accs });
            });
            const uncategorised = this.accounts.filter(a => !this.accountCategories.some(c => c.id === a.categoryId));
            if (uncategorised.length) groups.push({ id: '__uncategorised', name: 'Uncategorised', color: this.accountCategoryColor(''), accounts: uncategorised });

            groups.forEach(g => {
                const total = g.accounts.reduce((s,a) => s + this.balanceAsOf(a.id, mk), 0);
                const diff = this.groupMonthDiff(g.accounts, mk);
                const expanded = !!this.expandedTrackingCategories[g.id];
                let diffLine = '';
                if (diff !== null && diff !== 0) {
                    diffLine = '<div class="text-xs" style="color: ' + (diff >= 0 ? 'var(--color-success)' : 'var(--color-error)') + ';">' + (diff >= 0 ? '▲' : '▼') + ' ' + this.fmtSigned(diff) + '</div>';
                }
                html += '<div class="rounded-2xl shadow-sm mb-3 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
                html += '<button onclick="window.app.toggleTrackingCategoryExpand(\'' + g.id + '\')" class="w-full flex items-center justify-between p-4">';
                html += '<div class="flex items-center gap-3"><span class="text-xs" style="color: var(--color-text-muted);">' + (expanded ? '▾' : '▸') + '</span><span class="flex items-center justify-center rounded-full" style="width: 36px; height: 36px; background-color: ' + g.color + '; color: white; font-weight: 700; font-size: 14px;">' + g.name.charAt(0).toUpperCase() + '</span><span class="text-base font-bold" style="color: var(--color-text);">' + g.name + '</span></div>';
                html += '<div class="text-right"><div class="text-lg font-bold" style="color: var(--color-text);">' + this.fmt(total) + '</div>' + diffLine + '</div>';
                html += '</button>';
                if (expanded) {
                    html += '<div class="expand-content" style="border-top: 1px solid var(--color-border);">';
                    g.accounts.forEach((a,idx) => { html += this.renderTrackingAccountRow(a, mk, g.color, idx === g.accounts.length - 1); });
                    html += '</div>';
                }
                html += '</div>';
            });
        }

        html += this.renderTrackingCommentSection(mk);

        html += '<div class="rounded-2xl shadow-sm mt-4 p-3" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        if (this.addingAccount) html += this.renderAccountForm(null);
        else html += '<button onclick="window.app.toggleAddAccount()" class="text-sm font-semibold underline" style="color: var(--color-accent);">+ Add Account</button>';
        html += '</div>';
        return html;
    }

    // ---------- RENDER: REPORTING ----------
    renderMonthlyByCategorySection(taxYearMonthSet) {
        const cats = this.accountCategories.filter(c => this.accounts.some(a => a.categoryId === c.id));
        if (cats.length === 0) return '';
        let html = '<div class="flex items-center gap-2 mb-2 mt-1"><span>📅</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Month by Month by Category</p></div>';
        cats.forEach(cat => {
            const rows = this.categoryMonthlyTotals(cat.id).filter(r => taxYearMonthSet.has(r.monthKey)).slice().reverse();
            if (rows.length === 0) return;
            const expanded = !!this.expandedReportCategories[cat.id];
            html += '<div class="rounded-2xl shadow-sm mb-2 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
            html += '<button onclick="window.app.toggleReportCategoryExpand(\'' + cat.id + '\')" class="w-full flex items-center justify-between p-4">';
            html += '<span class="font-medium flex items-center gap-2" style="color: var(--color-text);"><span class="text-xs" style="color: var(--color-text-muted);">' + (expanded?'▾':'▸') + '</span>' + cat.name + '</span>';
            html += '<span class="font-bold" style="color: var(--color-text);">' + this.fmt(rows[0].total) + '</span></button>';
            if (expanded) {
                html += '<div class="expand-content" style="border-top: 1px solid var(--color-border);">';
                rows.forEach((r,idx) => {
                    html += '<div class="flex items-center justify-between p-3 pl-4' + (idx < rows.length-1?' border-b':'') + '" style="' + (idx < rows.length-1?'border-color: var(--color-border);':'') + '"><span class="text-xs" style="color: var(--color-text-muted);">' + this.monthLabel(r.monthKey) + '</span><div class="flex items-center gap-2"><span class="text-sm" style="color: var(--color-text);">' + this.fmt(r.total) + '</span>' + (r.diff !== null ? '<span class="text-xs" style="color: ' + (r.diff>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(r.diff) + '</span>' : '') + '</div></div>';
                });
                html += '</div>';
            }
            html += '</div>';
        });
        return html;
    }
    renderBalanceTrendSection(startYear) {
        const series = this.monthlyTotalBalanceSeries(startYear);
        const hasData = series.some(s => s.total !== 0);
        if (!hasData) return '';
        const max = Math.max(...series.map(s => s.total), 1);
        const min = Math.min(...series.map(s => s.total), 0);
        const range = (max - min) || 1;
        let html = '<div class="p-4 rounded-2xl shadow-sm mb-4" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-2 mb-3"><span>📉</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Balance Trend</p></div>';
        html += '<div class="flex items-end gap-1" style="height: 80px;">';
        series.forEach(s => {
            const heightPct = Math.max(4, ((s.total - min) / range) * 100);
            html += '<div class="flex-1 flex flex-col items-center justify-end h-full"><div style="width: 100%; height: ' + heightPct + '%; background-color: var(--color-primary); border-radius: 3px 3px 0 0;"></div></div>';
        });
        html += '</div>';
        html += '<div class="flex gap-1 mt-1">';
        series.forEach(s => { html += '<div class="flex-1 text-center" style="font-size: 9px; color: var(--color-text-muted);">' + this.monthLabel(s.monthKey).slice(0,3) + '</div>'; });
        html += '</div>';
        html += '<p class="text-xs mt-2" style="color: var(--color-text-muted);">' + this.fmt(series[0].total) + ' → ' + this.fmt(series[series.length-1].total) + '</p>';
        html += '</div>';
        return html;
    }
    renderSavingsRateSection(startYear) {
        const rate = this.savingsRateForTaxYear(startYear);
        if (rate === null) return '';
        const target = parseFloat(this.groupTargets.saving) || 0;
        let html = '<div class="p-4 rounded-2xl shadow-sm mb-4" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        html += '<div class="flex items-center gap-2 mb-1"><span>🎯</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Savings Rate</p></div>';
        let color = 'var(--color-text)';
        let targetText = '';
        if (target > 0) {
            const distance = Math.abs(rate - target);
            color = this.colorForTargetDistance(distance);
            targetText = ' · target ' + target + '%' + (distance <= 2 ? ' ✓' : '');
        }
        html += '<p class="text-3xl font-extrabold" style="color: ' + color + ';">' + rate.toFixed(1) + '%</p>';
        html += '<p class="text-xs" style="color: var(--color-text-muted);">' + targetText.replace(' · ','') + '</p>';
        html += '<p class="text-xs mt-1" style="color: var(--color-text-muted);">Share of your income kept as balance growth this tax year</p>';
        html += '</div>';
        return html;
    }
    renderISAAllowanceSection(startYear) {
        const hasISA = this.accounts.some(a => this.isISACategoryId(a.categoryId) || a.isLISA);
        if (!hasISA) return '';
        const allowance = 20000;
        const used = this.isaContributionsForTaxYear(startYear);
        const pct = Math.min(100, (used / allowance) * 100);
        const color = used > allowance ? 'var(--color-error)' : (pct >= 90 ? 'var(--color-warning)' : 'var(--color-success)');
        let html = '<div class="p-4 rounded-2xl shadow-sm mb-4" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        html += '<div class="flex items-center gap-2 mb-1"><span>🏛️</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">ISA Allowance</p></div>';
        html += '<p class="text-lg font-bold mb-2" style="color: var(--color-text);">' + this.fmt(used) + ' of ' + this.fmt(allowance) + '</p>';
        html += '<div class="w-full rounded-full h-3" style="background-color: var(--color-bg);"><div class="h-3 rounded-full" style="width: ' + pct + '%; background-color: ' + color + ';"></div></div>';
        html += '</div>';
        return html;
    }
    renderYearOverYearSection(startYear) {
        const thisYear = this.taxYearChangeSummary(startYear);
        const lastYear = this.taxYearChangeSummary(startYear - 1);
        if (thisYear.recordedCount === 0 && lastYear.recordedCount === 0) return '';
        let html = '<div class="p-4 rounded-2xl shadow-sm mb-4" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        html += '<div class="flex items-center gap-2 mb-3"><span>📆</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Year on Year</p></div>';
        html += '<div class="grid grid-cols-2 gap-3">';
        html += '<div><p class="text-xs" style="color: var(--color-text-muted);">' + this.taxYearLabel(startYear - 1) + '</p><p class="font-bold" style="color: ' + (lastYear.recordedCount>0 ? (lastYear.totalChange>=0?'var(--color-success)':'var(--color-error)') : 'var(--color-text-muted)') + ';">' + (lastYear.recordedCount>0 ? this.fmtSigned(lastYear.totalChange) : '—') + '</p></div>';
        html += '<div><p class="text-xs" style="color: var(--color-text-muted);">' + this.taxYearLabel(startYear) + '</p><p class="font-bold" style="color: ' + (thisYear.recordedCount>0 ? (thisYear.totalChange>=0?'var(--color-success)':'var(--color-error)') : 'var(--color-text-muted)') + ';">' + (thisYear.recordedCount>0 ? this.fmtSigned(thisYear.totalChange) : '—') + '</p></div>';
        html += '</div></div>';
        return html;
    }
    renderReportingTab() {
        let html = this.renderMonthlyReviewSection();
        html += '<div class="border-t pt-4 mt-2" style="border-color: var(--color-border);"></div>';
        const startYear = this.reportingTaxYear;
        const cs = this.taxYearChangeSummary(startYear);
        html += '<div class="flex items-center justify-between mb-3">';
        html += '<button onclick="window.app.shiftReportingTaxYear(-1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">‹</button>';
        html += '<p class="font-bold" style="color: var(--color-text);">Tax Year ' + this.taxYearLabel(startYear) + '</p>';
        html += '<button onclick="window.app.shiftReportingTaxYear(1)" class="w-9 h-9 rounded-full flex items-center justify-center" style="background-color: var(--color-secondary); color: var(--color-text);">›</button>';
        html += '</div>';
        html += '<div class="grid grid-cols-2 gap-3 mb-4">';
        html += '<div class="p-4 rounded-2xl shadow-sm" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-1 mb-1"><span style="font-size:12px;">💰</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Total Balance</p></div><p class="text-2xl font-bold" style="color: var(--color-text);">' + this.fmt(this.totalBalance()) + '</p></div>';
        if (cs.recordedCount > 0) {
            html += '<div class="p-4 rounded-2xl shadow-sm" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-1 mb-1"><span style="font-size:12px;">' + (cs.totalChange>=0?'📈':'📉') + '</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Change This Year</p></div><p class="text-2xl font-bold" style="color: ' + (cs.totalChange>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(cs.totalChange) + '</p></div>';
        } else {
            html += '<div class="p-4 rounded-2xl shadow-sm flex items-center" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><p class="text-xs" style="color: var(--color-text-muted);">No balances recorded yet this tax year — add them on the Tracking tab.</p></div>';
        }
        html += '</div>';

        html += this.renderBalanceTrendSection(startYear);
        html += this.renderSavingsRateSection(startYear);
        html += this.renderISAAllowanceSection(startYear);
        html += this.renderYearOverYearSection(startYear);

        html += '<div class="rounded-2xl shadow-sm mb-4 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-2 p-4 pb-2"><span>🏦</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Accounts</p></div>';
        if (this.accounts.length === 0) html += '<p class="px-4 pb-4" style="color: var(--color-text-muted); font-size: 14px;">No accounts yet.</p>';
        this.accounts.forEach((a,idx) => {
            html += '<div class="flex items-center justify-between p-4 pt-2' + (idx < this.accounts.length-1?' border-b':'') + '" style="border-color: var(--color-border);"><span style="color: var(--color-text);">' + a.name + ' <span class="text-xs" style="color: var(--color-text-muted);">(' + this.accountCategoryName(a.categoryId) + ')</span></span><span class="font-bold" style="color: var(--color-text);">' + this.fmt(this.accountBalance(a.id)) + '</span></div>';
        });
        html += '</div>';

        const taxYearMonthSet = new Set(this.taxYearMonths(startYear));
        html += this.renderMonthlyByCategorySection(taxYearMonthSet);

        const changes = this.biggestChangesForTaxYear(startYear);
        if (changes.length > 0) {
            html += '<div class="rounded-2xl shadow-sm mb-4 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-2 p-4 pb-2"><span>⚡</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Biggest Changes This Tax Year</p></div>';
            changes.forEach((c,idx) => {
                html += '<div class="flex items-center justify-between p-4 pt-2' + (idx < changes.length-1?' border-b':'') + '" style="border-color: var(--color-border);"><span style="color: var(--color-text);">' + c.name + '</span><span class="font-bold" style="color: ' + (c.change>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(c.change) + '</span></div>';
            });
            html += '</div>';
        }

        const tracked = this.trackedAccountsSummaryForTaxYear(startYear);
        if (tracked.length > 0) {
            html += '<div class="rounded-2xl shadow-sm overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);"><div class="flex items-center gap-2 p-4 pb-2"><span>🌱</span><p class="text-xs font-bold uppercase tracking-wide" style="color: var(--color-text-muted);">Contributions & Growth (' + this.taxYearLabel(startYear) + ')</p></div>';
            tracked.forEach((t,idx) => {
                html += '<div class="p-4 pt-2' + (idx < tracked.length-1?' border-b':'') + '" style="border-color: var(--color-border);"><p style="color: var(--color-text);">' + t.name + '</p><div class="flex items-center justify-between text-xs" style="color: var(--color-text-muted);"><span>' + this.fmt(t.totalInput) + ' put in</span><span style="color: ' + (t.growth>=0?'var(--color-success)':'var(--color-error)') + ';">' + this.fmtSigned(t.growth) + ' growth</span></div></div>';
            });
            html += '</div>';
        }
        return html;
    }

    // ---------- RENDER: SETTINGS ----------
    renderSettings() {
        let html = '';
        html += '<div class="p-4 rounded-2xl shadow-sm mb-3 flex items-center justify-between" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
        html += '<div class="flex items-center gap-2"><span class="flex items-center justify-center rounded-full flex-shrink-0" style="width: 32px; height: 32px; background-color: var(--color-bg); overflow: hidden;">' + (this.user && this.user.photoURL ? '<img src="' + this.user.photoURL + '" style="width:100%; height:100%; object-fit: cover;">' : '👤') + '</span><span class="text-xs" style="color: var(--color-text-muted);">' + (this.user ? (this.user.email || 'Signed in') : '') + '</span></div>';
        html += '<button onclick="window.app.signOutUser()" class="text-xs font-semibold px-3 py-2 rounded-lg" style="background-color: var(--color-secondary); color: var(--color-text);">🚪 Sign Out</button>';
        html += '</div>';

        const groups = [
            ['planning', 'Planning', [['categories','Planning Categories'],['income','Income'],['tasks','Monthly Tasks']]],
            ['tracking', 'Tracking', [['accounts','Accounts'],['accountCategories','Account Types']]],
            ['reporting', 'Reporting', [['pdf','PDF Report']]]
        ];
        groups.forEach(([groupKey, groupLabel, sections]) => {
            const expanded = !!this.expandedSettingsGroups[groupKey];
            html += '<div class="rounded-2xl shadow-sm mb-3 overflow-hidden" style="background-color: var(--color-surface); border: 1px solid var(--color-border);">';
            html += '<button onclick="window.app.toggleSettingsGroup(\'' + groupKey + '\')" class="w-full flex items-center justify-between p-4">';
            html += '<span class="text-base font-bold" style="color: var(--color-text);">' + (expanded ? '▾ ' : '▸ ') + groupLabel + '</span></button>';
            if (expanded) {
                html += '<div class="expand-content px-4 pb-4" style="border-top: 1px solid var(--color-border); padding-top: 12px;">';
                html += '<div class="flex gap-2 mb-3 flex-wrap">';
                sections.forEach(([secKey, secLabel]) => {
                    html += '<button onclick="window.app.settingsSection=\'' + secKey + '\'; window.app.render()" class="px-3 py-1 rounded-full text-sm" style="background-color: ' + (this.settingsSection===secKey?'var(--color-primary)':'var(--color-bg)') + '; color: ' + (this.settingsSection===secKey?'var(--color-primary-text)':'var(--color-text)') + ';">' + secLabel + '</button>';
                });
                if (groupKey === 'reporting') {
                    html += '<button onclick="window.app.exportCSV()" class="px-3 py-1 rounded-full text-sm" style="background-color: var(--color-bg); color: var(--color-text);">📥 Export CSV</button>';
                }
                html += '</div>';
                const currentBelongs = sections.some(([k]) => k === this.settingsSection);
                const activeSection = currentBelongs ? this.settingsSection : sections[0][0];
                html += this.renderSettingsSectionContent(activeSection);
                html += '</div>';
            }
            html += '</div>';
        });

        return html;
    }
    renderSettingsSectionContent(section) {
        let html = '';
        if (section === 'accounts') {
            html += '<label class="flex items-center gap-2 mb-3 p-2 rounded" style="background-color: var(--color-bg); color: var(--color-text);"><input type="checkbox" ' + (this.commentsEnabled ? 'checked' : '') + ' onchange="window.app.toggleCommentsEnabled(this.checked)"> Show end of month comments on Tracking?</label>';
            if (this.addingAccount) html += this.renderAccountForm(null);
            this.accounts.forEach(a => {
                if (this.editingAccount === a.id) { html += this.renderAccountForm(a); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span style="color: var(--color-text);">' + a.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(' + this.accountCategoryName(a.categoryId) + (a.isaType ? ' · ' + this.isaTypeLabel(a.isaType) : '') + (a.isLISA ? ' · LISA' : '') + (a.closed ? ' · Closed ' + this.monthLabel(a.closedMonth) : '') + ', opens ' + this.fmt(a.startingBalance) + (a.openingMonth ? ' as of ' + this.monthLabel(a.openingMonth) : '') + ')</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditAccount(\'' + a.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteAccount(\'' + a.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingAccount) html += '<button onclick="window.app.toggleAddAccount()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Account</button>';
        } else if (section === 'accountCategories') {
            if (this.addingAccountCategory) html += this.renderAccountCategoryForm(null);
            this.accountCategories.forEach(c => {
                if (this.editingAccountCategory === c.id) { html += this.renderAccountCategoryForm(c); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><span style="color: var(--color-text);">' + c.name + (c.trackInput ? ' <span class="text-xs" style="color: var(--color-text-muted);">(tracks input)</span>' : '') + '</span><div class="flex gap-1"><button onclick="window.app.toggleEditAccountCategory(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteAccountCategory(\'' + c.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingAccountCategory) html += '<button onclick="window.app.toggleAddAccountCategory()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Account Type</button>';
        } else if (section === 'categories') {
            if (this.addingCategory) html += this.renderCategoryForm(null);
            this.categories.forEach(c => {
                if (this.editingCategory === c.id) { html += this.renderCategoryForm(c); return; }
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span style="color: var(--color-text);">' + c.name + '</span> <span class="text-xs" style="color: var(--color-text-muted);">(' + this.categoryGroup(c) + (c.percentageBased ? ', %-based' : '') + ')</span></div><div class="flex gap-1"><button onclick="window.app.toggleEditCategory(\'' + c.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteCategory(\'' + c.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingCategory) html += '<button onclick="window.app.toggleAddCategory()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Planning Category</button>';
        } else if (section === 'income') {
            html += this.renderIncomeSettings();
        } else if (section === 'tasks') {
            html += '<label class="flex items-center gap-2 mb-3 p-2 rounded" style="background-color: var(--color-bg); color: var(--color-text);"><input type="checkbox" ' + (this.linkTasksToPlanning ? 'checked' : '') + ' onchange="window.app.toggleLinkTasksToPlanning(this.checked)"> Link tasks to planning amounts?</label>';
            if (this.addingTask) html += this.renderTaskForm(null);
            this.tasks.forEach((t, idx) => {
                if (this.editingTask === t.id) { html += this.renderTaskForm(t); return; }
                const linkedCount = (t.linkedCategoryIds || []).length;
                const linkedNote = (this.linkTasksToPlanning && linkedCount > 0) ? ' <span class="text-xs" style="color: var(--color-text-muted);">(' + linkedCount + ' linked, ' + this.fmt(this.linkedCategoriesTotal(t)) + ')</span>' : '';
                html += '<div class="flex items-center justify-between p-2 mb-2 rounded border" style="background-color: var(--color-bg); border-color: var(--color-border);"><div><span class="text-xs" style="color: var(--color-text-muted);">' + (idx+1) + '.</span> <span style="color: var(--color-text);">' + t.text + '</span>' + linkedNote + '</div><div class="flex gap-1"><button onclick="window.app.toggleEditTask(\'' + t.id + '\')" class="text-xs px-2 py-1 rounded" style="background-color: var(--color-secondary);">Edit</button><button onclick="window.app.deleteTask(\'' + t.id + '\')" style="background-color: var(--color-error); color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Delete</button></div></div>';
            });
            if (!this.addingTask) html += '<button onclick="window.app.toggleAddTask()" class="w-full py-2 rounded-lg mt-2" style="background-color: var(--color-secondary); color: var(--color-text);">+ Add Monthly Task</button>';
        } else if (section === 'pdf') {
            html += this.renderPDFReportSettings();
        }
        return html;
    }
    renderAccountForm(a) {

        if (this.accountCategories.length === 0) {
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">Add an account type first in Settings → Account Types.</p>';
            html += '<input type="hidden" id="ac_category" value="">';

            html += '<select id="ac_category" onchange="window.app.setAccountFormCategory(this.value)" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);">' + this.accountCategories.map(c => '<option value="' + c.id + '"' + (categoryUI===c.id?' selected':'') + '>' + c.name + '</option>').join('') + '</select>';
        }

        if (this.isISACategoryId(categoryUI)) {
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">ISA type</p>';
            html += '<select id="ac_isatype" class="w-full px-3 py-2 rounded border mb-2" style="border-color: var(--color-border);"><option value="cash"' + (a && a.isaType==='cash'?' selected':'') + '>Cash</option><option value="stocks_and_shares"' + (a && a.isaType==='stocks_and_shares'?' selected':'') + '>Stocks and Shares</option></select>';
            isaTypeArg = "document.getElementById('ac_isatype').value";
        }
        let lisaArg = 'false';
        if (this.isPensionCategoryId(categoryUI)) {
            html += '<label class="flex items-center gap-2 mb-2" style="color: var(--color-text);"><input id="ac_lisa" type="checkbox" ' + (this.accountFormLISAUI ? 'checked' : '') + ' onchange="window.app.setAccountFormLISA(this.checked)"> LISA?</label>';
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">If ticked, contributions here also count toward your ISA allowance, even though this account stays categorised as Pensions.</p>';
            lisaArg = "document.getElementById('ac_lisa').checked";
        }
        let manualGrowthArg = 'false';
        const willTrackInput = this.accountWillTrackInput(categoryUI, this.accountFormLISAUI);
        if (willTrackInput) {
            html += '<label class="flex items-center gap-2 mb-2" style="color: var(--color-text);"><input id="ac_manualgrowth" type="checkbox" ' + (a && a.manualGrowth ? 'checked' : '') + '> Enter interest/growth manually?</label>';
            html += '<p class="text-xs mb-2" style="color: var(--color-text-muted);">If ticked, you will type the interest/growth each month on Tracking instead of it being calculated as balance change minus what you put in.</p>';
            manualGrowthArg = "document.getElementById('ac_manualgrowth').checked";
        }
        let linkedCategoryArg = 'null';
        if (willTrackInput) {
            const linkedUI = this.accountFormLinkedCategoryUI !== undefined ? this.accountFormLinkedCategoryUI : (a && a.linkedCategoryId ? a.linkedCategoryId : '');
            html += '<p class="text-xs mb-1" style="color: var(--color-text-muted);">Link to planning category (optional)</p>';
