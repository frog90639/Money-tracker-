    <script>
class MoneyTracker {
    constructor(data, user) {
        this.user = user;
        this.accounts = data?.accounts || [];
        this.accountCategories = data?.accountCategories || this.defaultAccountCategories();
        this.categories = data?.categories || this.defaultCategories();
        this.monthlyBalances = data?.monthlyBalances || [];
        this.budgets = data?.budgets || [];
        this.tasks = data?.tasks || [];
        this.income = data?.income || { salary: 0, otherIncomeEnabled: false, otherIncomeAmount: 0 };
        this.currentMonthMode = data?.currentMonthMode || 'calendar';
        this.paydayDay = data?.paydayDay || 25;
        this.linkTasksToPlanning = data?.linkTasksToPlanning || false;
        this.setupGuideCompleted = data?.setupGuideCompleted || false;
        this.hasViewedTips = data?.hasViewedTips || false;
        this.toast = null;
        this.groupTargets = data?.groupTargets || { essential: 50, saving: 30, spending: 20 };
        this.currentTab = 'home';
        this.navHistory = [];
        this.sidebarOpen = false;
        this.settingsSection = 'accounts';
        this.expandedSettingsGroups = { planning: false, tracking: false, reporting: false };
        this.addingAccount = false;
        this.editingAccount = null;
        this.accountFormCategoryUI = '';
        this.accountFormLISAUI = false;
        this.accountFormClosedUI = false;
        this.accountFormNameUI = undefined;
        this.accountFormStartUI = undefined;
        this.accountFormOpeningMonthUI = undefined;
        this.accountFormClosedMonthUI = undefined;
        this.accountFormLinkedCategoryUI = undefined;
        this.addingAccountCategory = false;
        this.editingAccountCategory = null;
        this.addingCategory = false;
        this.editingCategory = null;
        this.categoryFormGroupUI = 'spending';
        this.addingTask = false;
        this.editingTask = null;
        this.taskFormLinkedCategories = [];
        this.editingBudget = null;
        this.editingGroupTargetsInline = false;
        this.expandedGroups = { essential: false, saving: false, spending: false, tasks: false };
        this.expandedReportCategories = {};
        this.expandedTrackingCategories = {};
        this.editingTrackingBalance = null;
        this.otherIncomeUIEnabled = this.income.otherIncomeEnabled;
        this.trackingMonth = this.currentMonthKey();
        this.reportingTaxYear = this.taxYearStartForMonthKey(this.monthKey());
        this.reviewMonth = this.currentMonthKey();
        this.monthlyComments = data?.monthlyComments || {};
        this.commentsEnabled = data?.commentsEnabled !== undefined ? data.commentsEnabled : true;
        this.editingComment = false;
        this.migrateLegacyIncomeCategories();
        this.migrateDefaultGroupTargets(data);
        this.render();
    }
    // If the user never customised their Planning Targets (still on the old
    // 50/20/30 default), move them onto the new 50/30/20 default.
    migrateDefaultGroupTargets(data) {
        if (!data || !data.groupTargets) return;
        const gt = data.groupTargets;
        if (gt.essential === 50 && gt.saving === 20 && gt.spending === 30) {
            this.groupTargets = { essential: 50, saving: 30, spending: 20 };
            this.saveData();
        }
    }
    // Removes old "Salary" / "Other Income" categories left over from earlier versions
    // of this app, where income lived as a category instead of a Settings > Income field.
    migrateLegacyIncomeCategories() {
        const legacyNames = ['salary', 'other income'];
        const before = this.categories.length;
        this.categories = this.categories.filter(c => !legacyNames.includes((c.name || '').trim().toLowerCase()));
        if (this.categories.length !== before) {
            const remainingIds = new Set(this.categories.map(c => c.id));
            this.budgets = this.budgets.filter(b => remainingIds.has(b.categoryId));
            this.saveData();
        }
    }
    defaultCategories() {
        return [
            { id: 'c_housing', name: 'Housing', group: 'essential' },
            { id: 'c_utilities', name: 'Utilities', group: 'essential' },
            { id: 'c_groceries', name: 'Groceries', group: 'essential' },
            { id: 'c_transport', name: 'Transport', group: 'essential' },
            { id: 'c_savings', name: 'Savings', group: 'saving' },
            { id: 'c_subscriptions', name: 'Subscriptions', group: 'spending' },
            { id: 'c_entertainment', name: 'Entertainment', group: 'spending' },
            { id: 'c_other', name: 'Other', group: 'spending' }
        ];
    }
    defaultAccountCategories() {
        return [
            { id: 'ac_bank', name: 'Bank' },
            { id: 'ac_savings', name: 'Savings' },
            { id: 'ac_isa', name: 'ISA', trackInput: true },
            { id: 'ac_investment', name: 'Investment' },
            { id: 'ac_pension', name: 'Pension' },
            { id: 'ac_property', name: 'Property' },
            { id: 'ac_other', name: 'Other' }
        ];
    }
    categoryGroup(c) { return c.group || 'spending'; }
    dataPayload() {
        return { accounts: this.accounts, accountCategories: this.accountCategories, categories: this.categories, monthlyBalances: this.monthlyBalances, budgets: this.budgets, tasks: this.tasks, income: this.income, groupTargets: this.groupTargets, monthlyComments: this.monthlyComments, linkTasksToPlanning: this.linkTasksToPlanning, currentMonthMode: this.currentMonthMode, paydayDay: this.paydayDay, setupGuideCompleted: this.setupGuideCompleted, commentsEnabled: this.commentsEnabled, hasViewedTips: this.hasViewedTips };
    }
    saveData() {
        if (!this.user) return;
        // Firestore rejects `undefined` field values (unlike localStorage/JSON.stringify,
        // which silently drops them) — round-trip through JSON to strip them safely.
        const payload = JSON.parse(JSON.stringify(this.dataPayload()));

    // ---------- ACCOUNTS ----------

    // ---------- SPENDING CATEGORIES ----------

    // ---------- INCOME SETTINGS ----------

    // ---------- BUDGETS (Planning) ----------

    // ---------- TASKS (Monthly recurring) ----------

    copyPlanningAmountsToTracking() {

    saveTask(id, text, orderPos) {

            t.linkedCategoryIds = linkedCategoryIds;
            this.tasks.splice(idx, 1);
            const insertAt = Math.min(pos - 1, this.tasks.length);

            this.editingTask = null;
        } else {
            const t = { id: this.uid(), text, paidMonths: {}, linkedCategoryIds };
